# Relay log shipper (docs/_INDEX.md Owed 106; owner, 2026-10-26: Fly's log shipper to
# Cloudflare R2, kept 30 days). Ships the relay apps' logs only, one process group per relay
# app: each group's SUBJECT filters the org's log stream to that app (the shipper takes one
# subject, and a NATS wildcard cannot match part of an app name without also taking the web
# apps' logs). Objects land under <app>/<date>/ (seazn-relay-stg/..., seazn-relay-prod/...),
# one JSON line per log line, each carrying fly.app.instance (the session's Machine id).
#
# Secrets (synced by the owner through Doppler, never here): FLY_ACCESS_TOKEN (a read-only
# org token), AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (an R2 token scoped to the bucket).
# The image reads the org token as ACCESS_TOKEN, so the process maps it before starting.
# Deploy: fly deploy -c ops/relay-logs/fly.toml
app = "seazn-relay-logs"
primary_region = "lhr"

[build]
  # v0.0.6, pinned by digest.
  image = "ghcr.io/superfly/fly-log-shipper@sha256:1f026d9d2fddd1bf30c57537e365711920c3730f01fff43753b425fbc5bde2e4"

[processes]
  app = "bash -c 'export ACCESS_TOKEN=\"$FLY_ACCESS_TOKEN\"; exec bash start-fly-log-transporter.sh'"
  prod = "bash -c 'export ACCESS_TOKEN=\"$FLY_ACCESS_TOKEN\" SUBJECT=\"logs.seazn-relay-prod.>\"; exec bash start-fly-log-transporter.sh'"

[env]
  ORG = "seazn-club"
  # The `app` group's subject (stg); the `prod` group overrides it in its command.
  SUBJECT = "logs.seazn-relay-stg.>"
  AWS_BUCKET = "seazn-relay-logs"
  AWS_REGION = "auto"
  # The image's sink template drops the quotes it puts around this value (the TOML then reads
  # a bare URL and vector refuses it), so the value carries its own.
  S3_ENDPOINT = '"https://ecaa471818e93892078446eae972a543.r2.cloudflarestorage.com"'

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

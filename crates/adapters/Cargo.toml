[package]
name = "adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
app = { path = "../app" }
# C07: the control plane's HTTP client. ureq 2, blocking: the control worker (C08) owns one thread for
# it, so no async runtime is needed. `tls` is rustls with webpki roots (no system OpenSSL in the image).
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"
# C09: the programme and output pipelines. GStreamer 1.24 is Ubuntu 24.04's (F-010); `v1_24` exposes
# its API, appsrc `leaky-type` among it.
gstreamer = { version = "0.24", features = ["v1_24"] }
gstreamer-app = { version = "0.24", features = ["v1_24"] }
gstreamer-video = { version = "0.24", features = ["v1_24"] }
crossbeam-channel = "0.5"
# C11: the reaper's SIGKILL and the CEF children's nice (`setpriority` per thread) without `unsafe`
# (the workspace forbids it); Owed 70 (a): the GPU watch's thread CPU clock (`time`). Already in the
# lock through tempfile.
rustix = { version = "1", default-features = false, features = ["std", "process", "param", "time"] }
# C12: the loopback programme-phase endpoint (`phase_http.rs`; overlay templates spec 2026-10-15 §4.3).
# The one HTTP server crate in the workspace: blocking, no async runtime, no TLS (loopback only).
tiny_http = "0.12"

[features]
# C09: `Stats::force_snapshot` and the pipeline stand-ins the C09 tests drive (a held sink write, a
# teardown that hangs); C11's and Owed 82's CEF hooks too. Two things enable it: this crate's own
# dev-dependency on itself (its tests), and the compositor's `test-hooks` feature (Owed 82, the
# Dockerfile's relay-test-hooks image). The relay image stays without it because its build
# (`cargo build --release -p compositor`, docker/Dockerfile's rust-build) names no feature and takes
# no dev-dependency, and image.yml checks its binary for the hooks' markers (PR #62 review m4).
test-hooks = []
# C11: the graphics tests need cefsrc (F-001's gstcefsrc build), which only the C12 image and the
# C00 spike image carry. CI's GStreamer has none, so `tests/graphics.rs` is built only with this
# feature (`required-features`, not `#[ignore]`: check.yml refuses a run with an ignored test).
cef = []

[[test]]
name = "graphics"
required-features = ["cef"]

[dev-dependencies]
# This crate's own integration tests (C09) and C12's join test use the test hooks.
adapters = { path = ".", features = ["test-hooks"] }
# The vendored contract is the arbiter: our heartbeat must validate against its JSON Schema (C07).
jsonschema = { version = "0.26", default-features = false }
sha2 = "0.10"
hex = "0.4"

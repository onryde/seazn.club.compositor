[package]
name = "adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
app = { path = "../app" }
# C07: the control plane's HTTP client. ureq 2, blocking: the control worker (C08) owns one thread for
# it, so no async runtime is needed. `tls` is rustls with webpki roots (no system OpenSSL in the image).
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde_json = "1"

[dev-dependencies]
# The vendored contract is the arbiter: our heartbeat must validate against its JSON Schema (C07).
jsonschema = { version = "0.26", default-features = false }
sha2 = "0.10"
hex = "0.4"

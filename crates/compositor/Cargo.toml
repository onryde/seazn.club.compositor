[package]
name = "compositor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "compositor"
path = "src/main.rs"

[features]
# Owed 82 (owner option A, 2026-10-24): C14 case 16's held-teardown hook (`COMPOSITOR_TEST_HOLD_TEARDOWNS`,
# `CefGraphics::hold_next_teardowns`). Only the Dockerfile's `relay-test-hooks` stage builds it; the
# default `relay` image is built without it, and image.yml checks that its binary carries none of it.
test-hooks = ["adapters/test-hooks"]

[dependencies]
domain = { path = "../domain" }
app = { path = "../app" }
adapters = { path = "../adapters" }
# The fake driver mode (C12's `COMPOSITOR_DRIVERS=fake`) runs testkit's fakes and scripted plane.
testkit = { path = "../testkit" }
crossbeam-channel = "0.5"
# SIGINT and SIGTERM on a dedicated thread (C12 Signals).
signal-hook = "0.3"
# RELAY_DEADLINE_AT (`Date.toISOString()`, RFC 3339) and the log lines' `ts=`.
time = { version = "0.3", features = ["parsing"] }
# RLIMIT_CORE and PR_SET_DUMPABLE (Owed 68) without `unsafe`. Already in the lock through the adapters.
rustix = { version = "1", default-features = false, features = ["std", "process"] }
# `_exit(2)` at the end of `main` (F-017): the workspace's one sanctioned `unsafe`.
hard-exit = { path = "../hard-exit" }

[dev-dependencies]
# fake_run.rs: the fake control plane the spawned binary talks to, and its phase endpoint client.
tiny_http = "0.12"
ureq = { version = "2", default-features = false }
serde_json = "1"
jsonschema = { version = "0.26", default-features = false }

name: soak
# The run list reads what the run can prove: a page=test run is PLUMBING ONLY, never a soak pass.
run-name: ${{ inputs.legs != '' && format('cost legs {0} on {1}, {2} min{3}', inputs.legs, inputs.guest, inputs.minutes, inputs.malloc_arena_max != '' && format(', MALLOC_ARENA_MAX={0}', inputs.malloc_arena_max) || '') || format('soak page={0} {1} min{2}{3}{4}{5}', inputs.page, inputs.minutes, inputs.page == 'test' && ' (PLUMBING ONLY)' || '', inputs.guest != 'performance-6x' && format(' on {0}', inputs.guest) || '', inputs.schedule == 'dropouts' && ', dropouts only' || inputs.schedule == 'none' && ', no dropouts (the control)' || '', inputs.malloc_arena_max != '' && format(', MALLOC_ARENA_MAX={0}', inputs.malloc_arena_max) || '') }}
# The soak (C15, docs/tasks/C15-soak.md, spec 9.5): the real relay image on the production guest, as
# one Fly Machine, against a harness Machine beside it (harness/soak: MediaMTX, fake-camera,
# fake-control, the checker and driver.sh), in the dedicated app seazn-relay-soak. This job drives
# it end to end: it builds and pushes both images, launches the Machines, watches the driver, hands
# the harness the compositor's log (the platform's log stream), fetches the outputs, judges them
# (harness/soak/verdict.sh), and destroys every Machine in the app whatever happened.
#
#   gh workflow run soak.yml --ref <branch> -f minutes=30 -f sha=<40-hex head>     (the rehearsal)
#   gh workflow run soak.yml --ref <branch> -f sha=<40-hex head>                   (the 3 h soak)
#   gh workflow run soak.yml --ref <branch> -f page=real -f minutes=16 -f legs=A:snow,A:noise   (the cost
#     legs' picture, once each on the production guest)
#   gh workflow run soak.yml --ref <branch> -f page=real -f minutes=16 -f legs=A,B,C,D -f camera=<heavier>
#     [-f guest=performance-8x]                                                      (the cost legs)
#   gh workflow run soak.yml --ref <branch> -f minutes=80 -f schedule=dropouts -f sha=<40-hex head>
#     [-f malloc_arena_max=2]                                                        (the memory experiment)
#   gh workflow run soak.yml --ref <branch> -f minutes=80 -f schedule=none -f sha=<40-hex head>
#                                                                                    (its control: no dropout)
#
# The memory experiment (soak 40139563554's drift, 2026-10-25): schedule=dropouts runs camera
# dropouts only, every 125 s (schedule.jq's dropout_plan: 35 in an 80-minute run), and schedule=none
# the same drive with nothing in it, as the control. The verdict prints the memory split's measures
# beside its checks: the compositor's own growth and CEF's, each dropout's step (from the minute
# lines, against a control from the gaps between dropouts) and the diagnosis's windowed step on the
# beats' memMb; on none, the same steps at the instants the dropouts would have had. Check 1.split
# judges those runs' evidence; the soak's own checks are unchanged. malloc_arena_max (a positive
# integer, or empty for unset) sets MALLOC_ARENA_MAX in the compositor Machine's environment, for the
# soak or the legs (the run's name says so). Nothing else reaches the compositor's environment from
# an input, and the compositor's own keys win over it.
#
# legs (C15's cost legs, harness/soak/cost): one job per leg, one at a time (max-parallel 1, since each
# destroys every Machine in the app at its end), each its own pair of Machines: soak.json's legs
# (720p or 1080p, bar on cricket or bug on badminton), no dropout or disconnect, a sampler a second on
# the compositor Machine and one renderer kill at the drive's midpoint (cost/leg.sh), judged by the
# size rule (cost/verdict.sh) and tabled by the cost-table job in F-005's shape. guest moves the
# compositor Machine to another performance size (soak.json's compositor_guest), for the legs or the
# soak: the size rule's next step is performance-8x.
#
# page=test (the default) serves C14's overlay-test.html: PLUMBING ONLY. Checks (a) to (d) read
# pending, and the run's best verdict is "plumbing", never "pass". page=real points the compositor
# at the production overlay page, served by a standalone seazn.club build on the harness Machine
# (the web job builds it at web_sha, with its own Postgres: harness/soak/web.Dockerfile). Nothing
# runs against stg or prod, and the build carries no telemetry key (web/bundle-check.sh).
#
# Credentials: FLY_API_TOKEN_SOAK (the job skips with a warning when it is empty), set on the steps
# that call flyctl only. The job token is random per run, masked, kept in mode-600 files under
# RUNNER_TEMP and handed to the Machines in their config file (never argv, never a log).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit to soak, 40 hex (both images are built from it). Empty: the ref's head."
        required: false
        default: ""
      minutes:
        description: "The Machines' run in minutes; the drive is this less soak.json's deadline_margin_min (185 = the 3 h soak)"
        required: true
        default: "185"
      page:
        description: "test (C14's overlay-test.html, PLUMBING ONLY) or real (the production page, from a standalone web build at web_sha)"
        type: choice
        options: [test, real]
        default: test
      web_sha:
        description: "page=real: the seazn.club commit to build, 40 hex (needs R2005 and R2007 PR A)"
        required: false
        # onryde/seazn.club main, 2026-10-24: R2005 (#982, e0608604c5) and R2007 PR A (#974) in.
        default: "7dcb3c42e23eb44ef69d7c564d4e9e0c5970d569"
      camera:
        description: "fake-camera's picture (a cost leg's default: snow or noise)"
        type: choice
        options: [ball, snow, noise]
        default: ball
      legs:
        description: "Cost legs instead of the soak (page=real): A,B,C,D, each optionally :snow or :noise (else camera). Empty: the soak"
        required: false
        default: ""
      guest:
        description: "The compositor Machine's guest (soak.json compositor_guest; production's is performance-6x)"
        type: choice
        options: [performance-4x, performance-6x, performance-8x]
        default: performance-6x
      schedule:
        description: "soak (dropouts and disconnects, schedule.jq's soak_plan), dropouts (the memory experiment: camera dropouts every 125 s, no disconnect) or none (its control: nothing in the drive)"
        type: choice
        options: [soak, dropouts, none]
        default: soak
      malloc_arena_max:
        description: "MALLOC_ARENA_MAX for the compositor process: a positive integer, or empty for unset (the memory experiment)"
        required: false
        default: ""
permissions: { contents: read }
concurrency:
  # One soak at a time: the cleanup destroys every Machine in the app, and a second run's would be
  # among them.
  group: soak
  cancel-in-progress: false
defaults:
  run: { shell: bash }
env:
  FLY_APP: seazn-relay-soak
  FLY_REGION: lhr
  # flyctl, pinned with its release checksum (superfly/flyctl v0.4.116, flyctl_0.4.116_checksums.txt).
  FLYCTL_VERSION: 0.4.116
  FLYCTL_SHA256: ab929c80ef0c1f7d623052267885632f47b4c5dd7c0ed8383d16f42472abe7b9
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      sha: ${{ steps.args.outputs.sha }}
      web_sha: ${{ steps.args.outputs.web_sha }}
      drive: ${{ steps.plan.outputs.drive }}
      timeout: ${{ steps.plan.outputs.timeout }}
      runs: ${{ steps.runs.outputs.runs }}
      mode: ${{ steps.runs.outputs.mode }}
      c_cpus: ${{ steps.runs.outputs.c_cpus }}
      c_mem: ${{ steps.runs.outputs.c_mem }}
      schedule: ${{ steps.runs.outputs.schedule }}
      c_env: ${{ steps.knobs.outputs.c_env }}
    steps:
      - name: The Fly token
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN_SOAK unset — soak skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: The inputs
        id: args
        env:
          SHA_IN: ${{ inputs.sha }}
          MINUTES: ${{ inputs.minutes }}
          PAGE: ${{ inputs.page }}
          WEB_SHA: ${{ inputs.web_sha }}
        run: |
          sha="${SHA_IN:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex: '$sha'"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] || { echo "::error::minutes must be whole minutes: '$MINUTES'"; exit 1; }
          case "$PAGE" in test | real) ;; *) echo "::error::page must be test or real"; exit 1 ;; esac
          if [ "$PAGE" = real ]; then
            [[ "$WEB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::web_sha must be 40 hex: '$WEB_SHA'"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "web_sha=$WEB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.args.outputs.sha }}
      # The memory experiment's knob: the compositor Machine's extra environment, as JSON. Only
      # MALLOC_ARENA_MAX (a positive integer); any other name refuses the run, so no input injects an
      # environment variable of its choosing. (GST_TRACERS left with PR #82's review I4: the leaks
      # tracer reports at gst_deinit, which the compositor's hard exit never reaches. It comes back
      # with the compositor-side checkpoint, README Owed.)
      - name: The compositor's knobs
        id: knobs
        env:
          MALLOC: ${{ inputs.malloc_arena_max }}
        run: |
          if [ -n "$MALLOC" ] && ! [[ "$MALLOC" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::malloc_arena_max must be a positive integer (1 to 9999) or empty: '$MALLOC'"; exit 1
          fi
          parts="$(jq -cn --arg m "$MALLOC" '[(if $m == "" then empty else {MALLOC_ARENA_MAX: $m} end)]')"
          # The names guard: whatever built the parts, objects only, this one name only, each a string.
          if ! jq -e 'all(.[]; type == "object")
                and ((add // {}) | (keys - ["MALLOC_ARENA_MAX"]) == [] and all(.[]; type == "string"))' \
            <<<"$parts" > /dev/null; then
            echo "::error::the compositor's extra environment may hold only MALLOC_ARENA_MAX (a string): $parts"; exit 1
          fi
          c_env="$(jq -c 'add // {}' <<<"$parts")"
          echo "c_env=$c_env" >> "$GITHUB_OUTPUT"
          echo "the compositor's extra environment: $c_env"
      # GitHub's expressions have no arithmetic: the numbers are made here, from soak.json.
      # The soak, or one run per cost leg: [{leg, camera}] for the soak job's matrix ({leg: ""} is the
      # soak), and the compositor's guest.
      - name: The runs
        id: runs
        env:
          LEGS: ${{ inputs.legs }}
          CAMERA: ${{ inputs.camera }}
          PAGE: ${{ inputs.page }}
          GUEST: ${{ inputs.guest }}
          SCHEDULE: ${{ inputs.schedule }}
        run: |
          s=harness/soak/soak.json
          jq -e --arg g "$GUEST" '.compositor_guest | has($g)' "$s" > /dev/null || { echo "::error::guest '$GUEST' is not in soak.json's compositor_guest"; exit 1; }
          echo "c_cpus=$(jq -r --arg g "$GUEST" '.compositor_guest[$g].cpus' "$s")" >> "$GITHUB_OUTPUT"
          echo "c_mem=$(jq -r --arg g "$GUEST" '.compositor_guest[$g].memory_mb' "$s")" >> "$GITHUB_OUTPUT"
          case "$SCHEDULE" in soak | dropouts | none) ;; *) echo "::error::schedule must be soak, dropouts or none: '$SCHEDULE'"; exit 1 ;; esac
          echo "schedule=$SCHEDULE" >> "$GITHUB_OUTPUT"
          if [ -z "$LEGS" ]; then
            echo "mode=soak" >> "$GITHUB_OUTPUT"
            echo "runs=$(jq -cn --arg c "$CAMERA" '[{leg: "", camera: $c}]')" >> "$GITHUB_OUTPUT"
            echo "the soak, camera $CAMERA, compositor on $GUEST"
            exit 0
          fi
          [ "$PAGE" = real ] || { echo "::error::the cost legs run the production page: page=real"; exit 1; }
          [ "$SCHEDULE" = soak ] || { echo "::error::the cost legs run no schedule: schedule=$SCHEDULE with legs"; exit 1; }
          runs="$(LEGS="$LEGS" jq -cn --slurpfile s "$s" --arg c "$CAMERA" '
            $s[0] as $s | $ENV.LEGS | split(",") | map(
              capture("^(?<leg>[A-Z])(:(?<camera>[a-z]+))?$") // error("legs: \(.) is not <leg>[:<camera>]")
              | .camera //= $c
              | . as $r
              | if ($s.legs | has($r.leg)) | not then error("legs: no leg \($r.leg) in soak.json")
                elif ($s.leg_cameras | index($r.camera)) == null then error("legs: camera \($r.camera) for leg \($r.leg): one of \($s.leg_cameras | join(", "))")
                else {leg, camera} end)
            | if length != (unique | length) then error("legs: a leg and camera twice") else . end')" \
            || { echo "::error::legs '$LEGS': each A to D, optionally :snow or :noise, no repeat (camera $CAMERA)"; exit 1; }
          echo "mode=legs" >> "$GITHUB_OUTPUT"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "cost legs $runs, compositor on $GUEST"
      - name: The run's numbers
        id: plan
        env:
          MINUTES: ${{ inputs.minutes }}
          LEGS: ${{ inputs.legs }}
        run: |
          s=harness/soak/soak.json
          drive=$((10#$MINUTES - $(jq -r .deadline_margin_min "$s")))
          timeout=$((10#$MINUTES + $(jq -r .timeout_after_min "$s")))
          # A cost leg drives at least leg_min_drive_min (the brief's 10 minutes); the soak min_drive_min.
          key=min_drive_min
          [ -z "$LEGS" ] || key=leg_min_drive_min
          min=$(jq -r ".$key" "$s")
          [ "$drive" -ge "$min" ] || { echo "::error::a $MINUTES-minute run drives $drive min, under soak.json's $key ($min)"; exit 1; }
          # GitHub's job cap is 360 minutes.
          [ "$timeout" -le 350 ] || { echo "::error::minutes + $(jq -r .timeout_after_min "$s") is $timeout, over the job cap"; exit 1; }
          echo "drive=$drive" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          echo "run $MINUTES min: drive $drive min, job timeout $timeout min"

  # page=real's page source: seazn.club at web_sha, built as production builds it (standalone, types
  # skipped), against a scratch Postgres migrated by db:apply and synced by sync:sports, then dumped.
  # No secret of any kind: no PostHog, Sentry or Stripe setting reaches the build, and the bundle
  # check fails the job if a key is in it. Its artifact is web.Dockerfile's input.
  web:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && inputs.page == 'real'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read }
    services:
      postgres:
        image: postgres:16
        env:
          # A scratch database on this runner only, reachable from nothing else.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: seazn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEB_SHA: ${{ needs.plan.outputs.web_sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          repository: onryde/seazn.club
          ref: ${{ needs.plan.outputs.web_sha }}
          path: web
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      # Dumped before anything else touches it: the schema and the sport catalog, nothing seeded.
      - name: The database (db:apply, sync:sports)
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/seazn
          DATABASE_SSL: disable
          PG: ${{ job.services.postgres.id }}
        run: |
          npm run db:apply
          npm run sync:sports
          B="$RUNNER_TEMP/build"
          mkdir -p "$B/db"
          # The server's own client (the same major as the image's restore); psql's \restrict lines
          # (16.10+) dropped, so an older psql restores it too.
          docker exec "$PG" pg_dumpall -U postgres --roles-only \
            | grep -vE '^(CREATE|ALTER) ROLE postgres( |;)|^\\(un)?restrict ' > "$B/db/roles.sql"
          docker exec "$PG" pg_dump -U postgres --no-owner seazn | grep -vE '^\\(un)?restrict ' > "$B/db/seazn.sql"
          echo "dumped: $(grep -c . "$B/db/roles.sql") role lines, $(du -h "$B/db/seazn.sql" | cut -f1) of schema and catalog"
      - name: Build (no telemetry setting)
        working-directory: web
        run: |
          if env | cut -d= -f1 | grep -E '^(NEXT_PUBLIC_)?(POSTHOG|SENTRY|STRIPE)'; then
            echo "::error::a PostHog, Sentry or Stripe setting is in the build's environment"
            exit 1
          fi
          SKIP_TYPECHECK=1 npm run build --workspace apps/web
          cd apps/web
          rm -rf .next/standalone/apps/web/.next/static
          cp -R .next/static .next/standalone/apps/web/.next/
          cp -R public .next/standalone/apps/web/
          test -f .next/standalone/apps/web/server.js
      # What app.tgz packs (the standalone tree, server.js and its inlined config with it) but the
      # third-party node_modules, and the database dump: the build inlines nothing into a package.
      - name: The bundle carries no telemetry key
        run: |
          A=web/apps/web/.next/standalone
          mapfile -t parts < <(find "$A" -mindepth 1 -maxdepth 1 ! -name node_modules ! -name apps -print; \
            find "$A/apps" -mindepth 2 -maxdepth 2 ! -name node_modules -print)
          [ "${#parts[@]}" -gt 0 ] || { echo "::error::nothing packed to scan"; exit 1; }
          harness/soak/web/bundle-check.sh "${parts[@]}" "$RUNNER_TEMP/build/db" | tee "$RUNNER_TEMP/bundle-check.txt"
      - name: Pack the page source
        run: |
          B="$RUNNER_TEMP/build"
          tar -czf "$B/app.tgz" -C web/apps/web/.next/standalone .
          cp "$(command -v node)" "$B/node"
          jq -n --arg web "$WEB_SHA" --arg node "$(node --version)" --arg check "$(tail -n 1 "$RUNNER_TEMP/bundle-check.txt")" \
            '{web_sha: $web, node: $node, bundle_check: $check}' > "$B/web.json"
          cat "$B/web.json"
          ls -l "$B" "$B/db"
      # One name per run, not per attempt: "Re-run failed jobs" re-runs images against it, and a
      # re-run web job replaces it.
      - uses: actions/upload-artifact@v4
        with:
          name: soak-web-${{ github.run_id }}
          path: ${{ runner.temp }}/build/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  images:
    needs: [plan, web]
    # The web job runs on page=real only: skipped is fine, failed or cancelled is not.
    if: >-
      !cancelled() && needs.plan.outputs.enabled == 'true'
      && (needs.web.result == 'success' || needs.web.result == 'skipped')
    runs-on: ubuntu-24.04
    # A cold CEF build (image.yml's); the soak job's own timeout covers the Machines only.
    timeout-minutes: 90
    # Read only: this workflow writes no GHCR cache and no GitHub cache. It pushes to Fly's registry.
    permissions: { contents: read, packages: read }
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      RELAY_IMAGE: seazn-relay:${{ needs.plan.outputs.sha }}
      HARNESS_IMAGE: seazn-harness:${{ needs.plan.outputs.sha }}
      SOAK_IMAGE: seazn-relay-soak:${{ needs.plan.outputs.sha }}
      WEB_IMAGE: seazn-relay-soak-web:${{ needs.plan.outputs.sha }}
      PAGE: ${{ inputs.page }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # CEF's build tree and three images do not fit the runner's free disk otherwise (image.yml).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # chaos.yml's cache choice, unchanged: GHCR alone when warm, GitHub's cache as well when cold,
      # a failed login read as cold, and nothing written.
      - name: Log in to GHCR (read)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cache (GHCR, read)
        id: cache
        run: |
          ref=
          if key=$(scripts/cef-cache-key.sh 2> "$RUNNER_TEMP/cache-key.err"); then
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seazn-relay-cache:cef-$key"
          else
            echo "::warning::no cache key, so a cold cache: $(head -c 300 "$RUNNER_TEMP/cache-key.err")"
          fi
          if [ -n "$ref" ] \
            && docker buildx imagetools inspect --raw "$ref" > "$RUNNER_TEMP/cache.json" 2> "$RUNNER_TEMP/cache-probe.err" \
            && scripts/cef-cache-holds-tree.sh "$RUNNER_TEMP/cache.json" 2>> "$RUNNER_TEMP/cache-probe.err"; then
            state=warm; from="type=registry,ref=$ref"
          else
            state=cold
            [ -z "$ref" ] || echo "cache probe: $(head -c 300 "$RUNNER_TEMP/cache-probe.err" 2> /dev/null)"
            from="type=gha"
            [ -z "$ref" ] || from="type=registry,ref=$ref"$'\n'"type=gha"
          fi
          echo "build cache: ${ref:-none} ($state)"
          { echo "from<<EOF"; echo "$from"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Build the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.RELAY_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      - name: Build the harness image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: harness
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.HARNESS_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      # On the docker driver, which sees the harness image just loaded (setup-buildx's builder does
      # not).
      - name: Build the soak harness image
        run: |
          docker buildx build --builder default --load -f harness/soak/Dockerfile \
            --build-arg HARNESS_IMAGE="$HARNESS_IMAGE" -t "$SOAK_IMAGE" .
      # page=real: the page source on top (after the CEF builds, so their context never holds it).
      - name: The page source (web job)
        if: inputs.page == 'real'
        uses: actions/download-artifact@v4
        with:
          name: soak-web-${{ github.run_id }}
          path: harness/soak/web/build
      - name: Build and smoke the page-source image
        if: inputs.page == 'real'
        run: |
          docker buildx build --builder default --load -f harness/soak/web.Dockerfile \
            --build-arg SOAK_IMAGE="$SOAK_IMAGE" -t "$WEB_IMAGE" .
          # up.sh as the Machine runs it, then three deliveries: a page source that does not come up
          # fails here, before anything runs on Fly.
          docker run --rm --entrypoint /soak/web/smoke.sh "$WEB_IMAGE"
      - name: flyctl
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flyctl.tgz" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "$FLYCTL_SHA256  $RUNNER_TEMP/flyctl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/flyctl.tgz" -C "$RUNNER_TEMP/bin" flyctl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Push to Fly's registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
        run: |
          flyctl auth docker
          harness="harness $SOAK_IMAGE"
          [ "$PAGE" != real ] || harness="harness-web $WEB_IMAGE"
          for pair in "relay $RELAY_IMAGE" "$harness"; do
            set -- $pair
            ref="registry.fly.io/$FLY_APP:$1-$SHA"
            docker tag "$2" "$ref"
            docker push -q "$ref"
            echo "pushed $ref"
          done

  soak:
    needs: [plan, images]
    # Explicit: a skipped web job (page=test) upstream of images must not skip this one.
    if: >-
      !cancelled() && needs.plan.outputs.enabled == 'true' && needs.images.result == 'success'
    name: ${{ matrix.run.leg == '' && 'soak' || format('cost leg {0} ({1})', matrix.run.leg, matrix.run.camera) }}
    # The soak is one run; the cost legs one each, never two at once: each run's cleanup destroys
    # every Machine in the app.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: ubuntu-24.04
    # minutes + soak.json's timeout_after_min (40), made by the plan job.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      MINUTES: ${{ inputs.minutes }}
      DRIVE_MIN: ${{ needs.plan.outputs.drive }}
      PAGE: ${{ inputs.page }}
      CAMERA: ${{ matrix.run.camera }}
      LEG: ${{ matrix.run.leg }}
      GUEST: ${{ inputs.guest }}
      C_CPUS: ${{ needs.plan.outputs.c_cpus }}
      C_MEM: ${{ needs.plan.outputs.c_mem }}
      SCHEDULE: ${{ needs.plan.outputs.schedule }}
      C_ENV: ${{ needs.plan.outputs.c_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: flyctl
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flyctl.tgz" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "$FLYCTL_SHA256  $RUNNER_TEMP/flyctl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/flyctl.tgz" -C "$RUNNER_TEMP/bin" flyctl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/out"

      # The harness Machine first (the compositor fetches its session from it), then the compositor
      # Machine, on the guest asked for (the production guest unless guest says otherwise). Both:
      # --restart no (a restart would invalidate criterion 3; the soak reports it rather than hides it)
      # and --rm (a Machine that exits is destroyed). A cost leg then starts cost/leg.sh.
      - name: Launch the Machines
        id: launch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
        run: |
          umask 077
          s=harness/soak/soak.json
          job_token="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          [[ "$job_token" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no job token"; exit 1; }
          echo "::add-mask::$job_token"
          printf '%s\n' "$job_token" > "$RUNNER_TEMP/job-token"
          session_id="$(python3 -I -c 'import uuid; print(uuid.uuid4())')"
          now_ms=$(($(date +%s%3N)))
          # The harness's copy of the deadline is this step's start plus the run: a lower bound on
          # the compositor's own, which is anchored at its launch (below), after the harness's boot
          # and, on page=real, up.sh. The hard stop is anchored here.
          deadline_ms=$((now_ms + 10#$MINUTES * 60000))
          hard_stop_ms=$((now_ms + (10#$MINUTES + $(jq -r .hard_stop_after_min "$s")) * 60000))
          iso() { python3 -I -c 'import datetime,sys; print(datetime.datetime.fromtimestamp(int(sys.argv[1]) / 1000, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%f")[:-3] + "Z")' "$1"; }
          # The harness's image and guest by page: on page=real it also carries the web server and
          # its Postgres (soak.json's harness_guest). The compositor's guest is the plan's (guest).
          h_image="registry.fly.io/$FLY_APP:harness-$SHA"
          [ "$PAGE" != real ] || h_image="registry.fly.io/$FLY_APP:harness-web-$SHA"
          h_cpus="$(jq -r --arg p "$PAGE" '.harness_guest[$p].cpus' "$s")"
          h_mem="$(jq -r --arg p "$PAGE" '.harness_guest[$p].memory_mb' "$s")"
          [[ "$h_cpus" =~ ^[0-9]+$ && "$h_mem" =~ ^[0-9]+$ ]] || { echo "::error::no harness_guest for page $PAGE"; exit 1; }
          echo "harness guest: performance-${h_cpus}x, $h_mem MB ($h_image)"
          leg_tag="${LEG:+-${LEG,,}-$CAMERA}"
          name_h="soak-harness-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT$leg_tag"
          name_c="soak-compositor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT$leg_tag"
          [[ "$C_CPUS" =~ ^[0-9]+$ && "$C_MEM" =~ ^[0-9]+$ ]] || { echo "::error::no compositor guest from the plan"; exit 1; }
          echo "compositor guest: $GUEST ($C_CPUS CPUs, $C_MEM MB)${LEG:+; cost leg $LEG, camera $CAMERA}"
          echo "name_h=$name_h" >> "$GITHUB_OUTPUT"
          echo "name_c=$name_c" >> "$GITHUB_OUTPUT"
          # The configs: every value through jq's environment, never its argv.
          JOB_TOKEN="$job_token" SESSION_ID="$session_id" DRIVE="$DRIVE_MIN" DEADLINE="$deadline_ms" \
            HARD_STOP="$hard_stop_ms" H_CPUS="$h_cpus" H_MEM="$h_mem" jq -n '{
              auto_destroy: true, restart: {policy: "no"},
              guest: {cpu_kind: "performance", cpus: ($ENV.H_CPUS | tonumber), memory_mb: ($ENV.H_MEM | tonumber)},
              env: {SESSION_ID: $ENV.SESSION_ID, JOB_TOKEN: $ENV.JOB_TOKEN, SOAK_DRIVE_MIN: $ENV.DRIVE,
                    SOAK_DEADLINE_MS: $ENV.DEADLINE, SOAK_HARD_STOP_MS: $ENV.HARD_STOP,
                    SOAK_PAGE: $ENV.PAGE, CAMERA_PATTERN: $ENV.CAMERA, SOAK_LEG: $ENV.LEG,
                    SOAK_SCHEDULE: $ENV.SCHEDULE}}' \
            > "$RUNNER_TEMP/harness.machine.json"
          machine_id() {
            flyctl machine list -a "$FLY_APP" --json | jq -r --arg n "$1" '(. // [])[] | select(.name == $n) | .id' | head -n 1
          }
          run_machine() {
            # $1 name, $2 image, $3 config, $4 cpus, $5 memory; the output stays in a file (it echoes the
            # config's image only, but nothing of a Machine's config is printed here).
            local rc=0
            flyctl machine run "$2" -a "$FLY_APP" -r "$FLY_REGION" --name "$1" --restart no --rm --detach \
              --vm-cpu-kind performance --vm-cpus "$4" --vm-memory "$5" --machine-config "$3" "${@:6}" \
              > "$RUNNER_TEMP/$1.run.log" 2>&1 || rc=$?
            rm -f "$3"
            grep -a -E "Machine ID|State|Image:" "$RUNNER_TEMP/$1.run.log" || true
            return "$rc"
          }
          # The harness: room for 3 h of recordings.
          run_machine "$name_h" "$h_image" "$RUNNER_TEMP/harness.machine.json" "$h_cpus" "$h_mem" --rootfs-size 30 \
            || { tail -n 20 "$RUNNER_TEMP/$name_h.run.log"; exit 1; }
          hid="$(machine_id "$name_h")"
          [[ "$hid" =~ ^[0-9a-z]+$ ]] || { echo "::error::no harness Machine id"; exit 1; }
          echo "harness=$hid" >> "$GITHUB_OUTPUT"
          echo "harness Machine $hid"
          flyctl machine wait "$hid" -a "$FLY_APP" --state started --wait-timeout 5m
          # fake-control up (the driver's phase leaves booting once /healthz answers) and the private
          # name resolving, before the compositor's first fetch.
          host="$hid.vm.$FLY_APP.internal"
          up=0
          for _ in $(seq 1 60); do
            st="$(flyctl machine exec "$hid" 'cat /out/status.json' -a "$FLY_APP" --timeout 20 2>/dev/null | grep -a '^{' | tail -n 1 || true)"
            ph="$(jq -r '.phase // ""' <<<"$st" 2>/dev/null || true)"
            if [ "$ph" = waiting_live ] && flyctl machine exec "$hid" "getent ahosts $host" -a "$FLY_APP" --timeout 20 > /dev/null 2>&1; then
              up=1; break
            fi
            case "$ph" in error | done) break ;; esac
            sleep 5
          done
          [ "$up" -eq 1 ] || { echo "::error::the harness never came up (phase '${ph:-none}')"; exit 1; }
          # The compositor's RELAY_DEADLINE_AT: its launch plus the run, so the drive (the run less
          # deadline_margin_min, from its first live beat) keeps the whole margin for its own boot and
          # the end, however long the harness took.
          deadline_c_ms=$(($(date +%s%3N) + 10#$MINUTES * 60000))
          [ "$deadline_c_ms" -lt "$hard_stop_ms" ] || { echo "::error::the compositor's deadline is past the hard stop"; exit 1; }
          deadline_at="$(iso "$deadline_c_ms")"
          echo "deadline_ms=$deadline_c_ms" >> "$GITHUB_OUTPUT"
          # The plan's knob (C_ENV: MALLOC_ARENA_MAX) under the compositor's own keys, which win on a
          # clash.
          echo "compositor extra environment: ${C_ENV:-none}"
          JOB_TOKEN="$job_token" SESSION_ID="$session_id" APP_URL="http://$host:7000" DEADLINE_AT="$deadline_at" jq -n '{
              auto_destroy: true, restart: {policy: "no"},
              guest: {cpu_kind: "performance", cpus: ($ENV.C_CPUS | tonumber), memory_mb: ($ENV.C_MEM | tonumber)},
              stop_config: {signal: "SIGTERM", timeout: "20s"},
              env: ((($ENV.C_ENV // "") | if . == "" then {} else fromjson end)
                    + {COMPOSITOR_DRIVERS: "live", SESSION_ID: $ENV.SESSION_ID, JOB_TOKEN: $ENV.JOB_TOKEN,
                       APP_URL: $ENV.APP_URL, RELAY_DEADLINE_AT: $ENV.DEADLINE_AT})}' \
            > "$RUNNER_TEMP/compositor.machine.json"
          run_machine "$name_c" "registry.fly.io/$FLY_APP:relay-$SHA" "$RUNNER_TEMP/compositor.machine.json" "$C_CPUS" "$C_MEM" \
            || { tail -n 20 "$RUNNER_TEMP/$name_c.run.log"; exit 1; }
          cid="$(machine_id "$name_c")"
          [[ "$cid" =~ ^[0-9a-z]+$ ]] || { echo "::error::no compositor Machine id"; exit 1; }
          echo "compositor=$cid" >> "$GITHUB_OUTPUT"
          echo "compositor Machine $cid, deadline $deadline_at"
          # The compositor's log, for the whole run, restarted if the stream drops (flylog.py drops the
          # replayed entries). In its own process group, so one kill stops the loop and its flyctl.
          setsid bash -c 'while :; do flyctl logs -a "$0" --machine "$1" --json; sleep 2; done' "$FLY_APP" "$cid" \
            >> "$RUNNER_TEMP/compositor.stream.json" 2>> "$RUNNER_TEMP/compositor.stream.err" < /dev/null &
          echo "$!" > "$RUNNER_TEMP/stream.pid"
          # A cost leg's runner side (cost/leg.sh: the sampler a second on the compositor Machine, the
          # renderer kill at the drive's midpoint), in its own process group, bounded by the hard stop.
          if [ -n "$LEG" ]; then
            setsid harness/soak/cost/leg.sh --app "$FLY_APP" --harness "$hid" --compositor "$cid" \
              --out "$RUNNER_TEMP/out" --until-ms "$hard_stop_ms" < /dev/null > /dev/null 2>&1 &
            echo "$!" > "$RUNNER_TEMP/leg.pid"
            echo "cost leg $LEG: leg.sh started (its log: cost-leg.log)"
          fi

      # The driver's status every minute, until /out/done or minutes + soak.json's poll_after_min. Once
      # the driver has ended the run (phase awaiting_log) and the compositor Machine has exited, its log
      # goes to the harness (/out/compositor.log, then /out/log-ready) for the checker.
      - name: Watch the run
        id: watch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
          HID: ${{ steps.launch.outputs.harness }}
          CID: ${{ steps.launch.outputs.compositor }}
        run: |
          OUT="$RUNNER_TEMP/out"
          deadline=$(($(date +%s) + (10#$MINUTES + $(jq -r .poll_after_min harness/soak/soak.json)) * 60))
          send_log() {
            local state=""
            for _ in $(seq 1 36); do
              state="$(flyctl machine list -a "$FLY_APP" --json | jq -r --arg id "$CID" '(. // [])[] | select(.id == $id) | .state' || true)"
              case "$state" in "" | stopped | destroying | destroyed | failed) break ;; esac
              sleep 5
            done
            echo "compositor Machine: ${state:-gone}; the stream's lag, then the log"
            sleep 30
            kill -- "-$(cat "$RUNNER_TEMP/stream.pid")" 2> /dev/null || true
            python3 -I harness/soak/flylog.py --in "$RUNNER_TEMP/compositor.stream.json" --machine "$CID" \
              --log "$OUT/compositor.log" --scan "$OUT/logscan.json" || echo "::warning::the compositor's log stream was empty"
            [ -f "$OUT/compositor.log" ] || : > "$OUT/compositor.log"
            flyctl ssh sftp put "$OUT/compositor.log" /out/compositor.log -a "$FLY_APP" --machine "$HID" -q \
              || echo "::warning::the log upload failed: the checker runs without it"
            flyctl machine exec "$HID" 'touch /out/log-ready' -a "$FLY_APP" --timeout 20 > /dev/null || true
          }
          sent=0
          phase=""
          while :; do
            st="$(flyctl machine exec "$HID" 'cat /out/status.json' -a "$FLY_APP" --timeout 30 2>/dev/null | grep -a '^{' | tail -n 1 || true)"
            phase="$(jq -r '.phase // ""' <<<"$st" 2>/dev/null || true)"
            echo "$(date -u +%H:%M:%S) $(jq -c '{phase, note, actions, beats}' <<<"$st" 2>/dev/null || echo 'no status')"
            if [ "$sent" -eq 0 ] && [ "$phase" = awaiting_log ]; then send_log; sent=1; continue; fi
            case "$phase" in done | error) break ;; esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no /out/done within minutes + poll_after_min (phase '${phase:-none}')"
              break
            fi
            sleep 60
          done
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Fetch the outputs
        if: always() && steps.launch.outputs.harness != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
          HID: ${{ steps.launch.outputs.harness }}
        run: |
          OUT="$RUNNER_TEMP/out"
          got=0
          for f in report.json actions.jsonl heartbeats.jsonl control-state.json timeline.json done status.json \
                   secrets.json ended overlay-samples.jsonl driver.log checker.log sampler.log fake-control.log \
                   fake-camera.log mediamtx.log deliveries.jsonl score.log seed.json web-up.log web.log postgres.log \
                   stills.log stills.tar; do
            rm -f "$OUT/$f.part"
            if flyctl ssh sftp get "/out/$f" "$OUT/$f.part" -a "$FLY_APP" --machine "$HID" -q > /dev/null 2>> "$OUT/fetch.err"; then
              mv "$OUT/$f.part" "$OUT/$f"; got=$((got + 1))
            else
              rm -f "$OUT/$f.part"; echo "not fetched: $f"
            fi
          done
          flyctl machine exec "$HID" 'ls -l /out/rec/live/dest' -a "$FLY_APP" --timeout 30 > "$OUT/recordings.txt" 2>&1 || true
          echo "fetched $got files; $(grep -c 'mp4' "$OUT/recordings.txt" || true) recording segments"
          [ "$got" -gt 0 ] || { echo "::error::nothing fetched from the harness"; head -c 600 "$OUT/fetch.err"; exit 1; }

      # The job token in nothing this job keeps, and the harness's own scan of its /out (secrets.json:
      # the job token, the SRT passphrase and, on page=real, the page source's credentials) clean; the
      # driver runs it on its error path too. Any leak uploads nothing, and prints the harness's
      # redacted report (kind, file:line, the line with every credential replaced by its name). With
      # no harness scan at all: page=test uploads on this job's scan alone, for the diagnosis; page=real
      # keeps only status.json and done (nothing here can scan for the page source's credentials), and
      # its compositor log goes up only when the harness scanned those exact bytes (sha256).
      - name: Leak gate
        id: leaks
        if: always() && steps.launch.outputs.harness != ''
        env:
          # Scanned for too: a cost leg's leg.sh runs flyctl with it beside files that are kept
          # (cost-leg.log, cost-samples.err). Never in argv: a mode-600 pattern file (printf is a builtin).
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
        run: |
          OUT="$RUNNER_TEMP/out"
          n="$(find "$OUT" -type f | wc -l)"
          [ -s "$RUNNER_TEMP/job-token" ] || { echo "::error::no job token file to scan with"; exit 1; }
          [ "$n" -gt 0 ] || { echo "::error::nothing to scan"; exit 1; }
          # An empty line in a -f list matches every line, so an unset token adds none.
          ( umask 077; cat "$RUNNER_TEMP/job-token" > "$RUNNER_TEMP/scan-patterns"
            [ -z "${FLY_API_TOKEN:-}" ] || printf '%s\n' "$FLY_API_TOKEN" >> "$RUNNER_TEMP/scan-patterns" )
          if grep -rqF -f "$RUNNER_TEMP/scan-patterns" "$OUT" "$RUNNER_TEMP/compositor.stream.json" 2> /dev/null; then
            echo "::error::the job token or the Fly token is in a fetched file: nothing is uploaded"
            exit 1
          fi
          if [ -f "$OUT/secrets.json" ]; then
            if ! jq -e '.scanned > 0 and .leaks == 0' "$OUT/secrets.json" > /dev/null; then
              echo "::error::the harness's scan is not clean ($(jq -c '{scanned, leaks, skipped}' "$OUT/secrets.json")): nothing is uploaded"
              jq -r '.leaked[]? | "leaked: \(.kind) in \(.where | join("; "))"' "$OUT/secrets.json"
              exit 1
            fi
            # The compositor's log here is this job's own copy (the watch step converted it and sent it to
            # the harness). On page=real it goes up only when the harness scanned those very bytes:
            # a failed or partial upload leaves the harness a different file, and this copy unscanned
            # for the page source's credentials.
            if [ "$PAGE" = real ] && [ -f "$OUT/compositor.log" ]; then
              here="$(python3 -I -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$OUT/compositor.log")"
              if [ "$(jq -r '.compositor_log_sha256 // ""' "$OUT/secrets.json")" != "$here" ]; then
                rm -f "$OUT/compositor.log"
                echo "::warning::the harness did not scan this compositor log (its upload failed or differs): not uploaded"
              fi
            fi
            echo "secrets: $n files here clean; the harness's scan $(jq -c '{scanned, leaks, skipped}' "$OUT/secrets.json")"
          elif [ "$PAGE" = real ]; then
            find "$OUT" -type f ! -name status.json ! -name done -delete
            echo "::warning::no harness scan on page=real: only status.json and done are uploaded"
          else
            echo "::warning::no harness scan (the driver stopped before it): $n files uploaded on this job's scan"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Verdict
        id: verdict
        if: always() && steps.leaks.outputs.ok == 'true'
        run: |
          OUT="$RUNNER_TEMP/out"
          rc=0
          # A cost leg is judged by the size rule (cost/verdict.sh), its F-005 column in the summary.
          if [ -n "$LEG" ]; then
            harness/soak/cost/verdict.sh --dir "$OUT" --leg "$LEG" --camera "$CAMERA" --guest "$GUEST" \
              > "$OUT/cost.json" 2> "$OUT/cost.txt" || rc=$?
            cat "$OUT/cost.txt"
            status="$(jq -r '.status // "none"' "$OUT/cost.json" 2> /dev/null || echo none)"
            echo "status=$status" >> "$GITHUB_OUTPUT"
            {
              echo "# cost leg $LEG: $status (camera $CAMERA, $GUEST, $DRIVE_MIN min drive)"
              harness/soak/cost/table.sh "$OUT/cost.json" || echo "(no table)"
              echo '```'; cat "$OUT/cost.txt"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if ! jq -e '.ok and .checker_exit == 0 and .ended_early == null' "$OUT/done" > /dev/null 2>&1; then
              echo "::error::the driver did not finish clean: $(jq -c . "$OUT/done" 2> /dev/null || echo 'no done')"
              [ "$rc" -ne 0 ] || rc=1
            fi
            exit "$rc"
          fi
          # --memory-mb: the compositor Machine's memory, check 1.projection's budget (soak.json).
          harness/soak/verdict.sh --dir "$OUT" --page "$PAGE" --drive-min "$DRIVE_MIN" --schedule "$SCHEDULE" \
            --memory-mb "$C_MEM" > "$OUT/verdict.json" 2> "$OUT/verdict.txt" || rc=$?
          cat "$OUT/verdict.txt"
          status="$(jq -r '.status // "none"' "$OUT/verdict.json" 2> /dev/null || echo none)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = plumbing ]; then
            echo "# PLUMBING ONLY — NOT A SOAK PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "page=test: checks (a) to (d) are pending on the page source." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PLUMBING ONLY: page=test, so checks (a) to (d) are pending; this run is not a soak pass"
          else
            echo "# soak: $status (page=$PAGE, $DRIVE_MIN min drive)" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo '```'; cat "$OUT/verdict.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The driver's own word too: it finished, the checker ran clean, nothing leaked.
          if ! jq -e '.ok and .checker_exit == 0 and .ended_early == null' "$OUT/done" > /dev/null 2>&1; then
            echo "::error::the driver did not finish clean: $(jq -c . "$OUT/done" 2> /dev/null || echo 'no done')"
            [ "$rc" -ne 0 ] || rc=1
          fi
          exit "$rc"

      - name: Upload the outputs
        if: always() && steps.leaks.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ github.run_id }}-${{ github.run_attempt }}${{ matrix.run.leg != '' && format('-{0}-{1}', matrix.run.leg, matrix.run.camera) || '' }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      # A cancelled, failed or timed-out run must never leave Machines billing: every Machine in the
      # app is destroyed (the concurrency group keeps it to this run's), and the list must then read
      # empty, or this step fails.
      - name: Destroy every Machine
        id: destroy
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SOAK }}
        run: |
          [ ! -f "$RUNNER_TEMP/stream.pid" ] || kill -- "-$(cat "$RUNNER_TEMP/stream.pid")" 2> /dev/null || true
          [ ! -f "$RUNNER_TEMP/leg.pid" ] || kill -- "-$(cat "$RUNNER_TEMP/leg.pid")" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/job-token" "$RUNNER_TEMP"/*.machine.json
          if ! command -v flyctl > /dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/flyctl.tgz" \
              "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
            echo "$FLYCTL_SHA256  $RUNNER_TEMP/flyctl.tgz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/flyctl.tgz" -C "$RUNNER_TEMP/bin" flyctl
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          left=""
          for attempt in 1 2 3 4 5 6; do
            ids="$(flyctl machine list -a "$FLY_APP" --json | jq -r '(. // [])[] | select(.state != "destroyed") | .id')" || { sleep 10; continue; }
            left="$(printf '%s' "$ids" | grep -c . || true)"
            [ "$left" -eq 0 ] && break
            for id in $ids; do flyctl machine destroy "$id" -a "$FLY_APP" --force || true; done
            sleep 10
          done
          flyctl machine list -a "$FLY_APP"
          if [ "$left" != 0 ]; then
            echo "::error::Machines left in $FLY_APP after the cleanup (${left:-the list never answered}): destroy them by hand"
            exit 1
          fi
          echo "$FLY_APP: no Machines"

      - name: Fail on a red verdict
        if: always() && steps.verdict.outcome != 'success'
        env:
          STATUS: ${{ steps.verdict.outputs.status }}
          WATCH: ${{ steps.watch.outcome }}
        run: |
          what=soak
          [ -z "$LEG" ] || what="cost leg $LEG"
          echo "::error::the $what is red (verdict: ${STATUS:-not judged}, watch: ${WATCH:-not run})"
          exit 1

  # The cost legs' table: every leg's verdict (its artifact's cost.json) in one F-005-shaped table,
  # for F-0xx "real overlay cost". A leg whose outputs were not uploaded (a leak) is missing from it.
  cost-table:
    needs: [plan, soak]
    if: ${{ !cancelled() && needs.plan.outputs.enabled == 'true' && needs.plan.outputs.mode == 'legs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: soak-${{ github.run_id }}-*
          path: ${{ runner.temp }}/legs
      - name: The cost table
        env:
          GUEST: ${{ inputs.guest }}
          RUNS: ${{ needs.plan.outputs.runs }}
        run: |
          # Each leg:camera's latest attempt (a re-run of a failed leg leaves both attempts' artifacts,
          # soak-<run>-<attempt>-<leg>-<camera>), then every run asked for, or a red naming the missing.
          declare -A best
          for d in "$RUNNER_TEMP/legs"/soak-"$GITHUB_RUN_ID"-*; do
            c="$(find "$d" -name cost.json 2> /dev/null | head -n 1)"
            [ -n "$c" ] || continue
            n="${d##*/soak-"$GITHUB_RUN_ID"-}"
            a="${n%%-*}" key="${n#*-}"
            [[ $a =~ ^[0-9]+$ ]] || continue
            if [ -z "${best[$key]:-}" ] || [ "$a" -gt "${best[$key]%%:*}" ]; then best[$key]="$a:$c"; fi
          done
          f=()
          for key in "${!best[@]}"; do f+=("${best[$key]#*:}"); done
          want="$(jq 'length' <<< "$RUNS")"
          [ "${#f[@]}" -gt 0 ] || { echo "::error::no leg's verdict (cost.json) among the artifacts"; exit 1; }
          { echo "# cost legs on $GUEST: ${#f[@]} of $want run(s), each its latest attempt"; harness/soak/cost/table.sh "${f[@]}"; } | tee -a "$GITHUB_STEP_SUMMARY"
          missing="$(jq -r '.[] | "\(.leg)-\(.camera)"' <<< "$RUNS" | while read -r k; do [ -n "${best[$k]:-}" ] || printf '%s ' "$k"; done)"
          if [ -n "$missing" ]; then
            echo "::error::no verdict for ${missing% }: that leg's job stopped before its verdict"
            exit 1
          fi

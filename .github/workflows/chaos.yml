name: chaos
# The chaos suite (C14): every leg of harness/chaos.json (each harness/cases/<case>.sh, variant and
# repeat) is its own matrix leg with fail-fast off, so one red never hides another. run-chaos.sh's
# table then reads every leg's verdict.json and goes red on any FAIL, ERROR or MISSING, and on any
# NOT RUNNABLE leg: an unrun leg is never green, and the table's last lines say whether the run
# counts toward wave gate 3.
#
# The relay and harness images are built once, as harness.yml builds them (image.yml's caches, read
# only), and handed to the legs as an artifact, with the relay-test-hooks image beside them: the
# relay image with the test hooks compiled in (the Dockerfile's `relay-test-hooks` target, never
# pushed): Owed 82's held teardowns and Owed 94's stalled sink. Only case 16 (cef-leaks) and case 18
# (output-hung) run on it (their RELAY_TEST_HOOKS_IMAGE); every other leg runs the relay image. The compose stack runs here and nowhere local (owner ruling
# 2026-10-23: no local Docker).
#
# Wave gate 3 is three consecutive green full runs. Dispatch each one after the last has finished
# green:
#   gh workflow run chaos.yml --ref <branch> -f cases=all
# One leg, or a few (a leg is <case>[-<variant>], and it brings all its repeats):
#   gh workflow run chaos.yml --ref <branch> -f cases=cef-killed,cef-gpu-deaths-fast
# Re-judge a leg's downloaded out/<run> after a verdict change, with no stack:
#   CASE_REJUDGE=1 CASE_OUT_ROOT=<dir> harness/run-case.sh <case> [<variant>]
on:
  pull_request:
    paths:
      - "harness/**"
      - "crates/harness/**"
      - ".github/workflows/chaos.yml"
  workflow_dispatch:
    inputs:
      cases:
        description: "all, or a comma list of legs: <case>[-<variant>] from harness/chaos.json"
        required: true
        default: all
permissions: { contents: read }
concurrency:
  group: chaos-${{ github.event_name }}-${{ github.ref }}
  # A pull request's newer push replaces its older run; a dispatched run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  # `bash -eo pipefail`: the implicit default has no pipefail (check.yml's note).
  run: { shell: bash }
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - name: The legs
        id: plan
        env:
          CASES: ${{ inputs.cases || 'all' }}
        run: |
          legs="$(harness/run-chaos.sh --legs "$CASES")"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "$(jq length <<<"$legs") legs: $(jq -r 'map(.name) | join(" ")' <<<"$legs")"

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Read only: this workflow never writes a cache or the registry.
    permissions: { contents: read, packages: read }
    env:
      RELAY_IMAGE: seazn-relay:${{ github.sha }}
      RELAY_TEST_HOOKS_IMAGE: seazn-relay-test-hooks:${{ github.sha }}
      HARNESS_IMAGE: seazn-harness:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # CEF's build tree and two images do not fit the runner's free disk otherwise (image.yml).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # harness.yml's cache choice, unchanged: GHCR alone when warm, GitHub's cache as well when
      # cold, a failed login read as cold, and nothing written.
      - name: Log in to GHCR (read)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cache (GHCR, read)
        id: cache
        run: |
          ref=
          if key=$(scripts/cef-cache-key.sh 2> "$RUNNER_TEMP/cache-key.err"); then
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seazn-relay-cache:cef-$key"
          else
            echo "::warning::no cache key, so a cold cache: $(head -c 300 "$RUNNER_TEMP/cache-key.err")"
          fi
          if [ -n "$ref" ] \
            && docker buildx imagetools inspect --raw "$ref" > "$RUNNER_TEMP/cache.json" 2> "$RUNNER_TEMP/cache-probe.err" \
            && scripts/cef-cache-holds-tree.sh "$RUNNER_TEMP/cache.json" 2>> "$RUNNER_TEMP/cache-probe.err"; then
            state=warm; from="type=registry,ref=$ref"
          else
            state=cold
            [ -z "$ref" ] || echo "cache probe: $(head -c 300 "$RUNNER_TEMP/cache-probe.err" 2> /dev/null)"
            from="type=gha"
            [ -z "$ref" ] || from="type=registry,ref=$ref"$'\n'"type=gha"
          fi
          echo "build cache: ${ref:-none} ($state)"
          { echo "from<<EOF"; echo "$from"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Build the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.RELAY_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      # Cases 16 and 18 only (Owed 82, Owed 94): the relay image plus the compositor built with
      # `--features test-hooks`, so their legs can hold teardowns (COMPOSITOR_TEST_HOLD_TEARDOWNS) or
      # stall the first sink (COMPOSITOR_TEST_HOLD_SINK_AFTER_MS, COMPOSITOR_TEST_HANG_SINK_AFTER_MS).
      - name: Build the relay-test-hooks image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: relay-test-hooks
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.RELAY_TEST_HOOKS_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      - name: Build the harness image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: harness
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.HARNESS_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      - name: Save the images
        run: |
          docker save "$RELAY_IMAGE" "$RELAY_TEST_HOOKS_IMAGE" "$HARNESS_IMAGE" | zstd -T0 -3 -q -o "$RUNNER_TEMP/images.tar.zst"
          ls -l "$RUNNER_TEMP/images.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: chaos-images
          path: ${{ runner.temp }}/images.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  leg:
    needs: [plan, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: ${{ matrix.leg.name }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    env:
      RELAY_IMAGE: seazn-relay:${{ github.sha }}
      RELAY_TEST_HOOKS_IMAGE: seazn-relay-test-hooks:${{ github.sha }}
      HARNESS_IMAGE: seazn-harness:${{ github.sha }}
      LEG: ${{ matrix.leg.name }}
      LEG_CASE: ${{ matrix.leg.case }}
      LEG_VARIANT: ${{ matrix.leg.variant }}
      CASE_RUN: ${{ matrix.leg.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chaos-images
          path: ${{ runner.temp }}/images
      - name: Load the images
        run: |
          zstd -dc "$RUNNER_TEMP/images/images.tar.zst" | docker load
          rm -f "$RUNNER_TEMP/images/images.tar.zst"
      # netem.sh's qdiscs and filter: loaded on the host kernel, which every container shares.
      - name: Kernel modules for netem
        run: |
          sudo modprobe -a sch_prio sch_netem cls_u32 || echo "modprobe failed: netem.sh's check will say whether tc works"
          lsmod | grep -E '^(sch_prio|sch_netem|cls_u32)' || true
      # run-case.sh keeps its console in harness/out/<leg>/console.log and scans every file there
      # for the run's credentials at every exit (secrets.json). A NOT RUNNABLE leg (its verdict
      # says so, with why) is red too: an unrun leg never counts as a pass.
      - name: Run the leg
        run: |
          rc=0
          harness/run-case.sh "$LEG_CASE" ${LEG_VARIANT:+"$LEG_VARIANT"} || rc=$?
          if [ "$(jq -r '.status // ""' "harness/out/$LEG/verdict.json" 2>/dev/null)" = not_runnable ]; then
            # The words come from the verdict itself, so the step's own source, which GitHub prints
            # in every leg's log, never carries them (C14 fix round 2, item 6).
            jq -r --arg leg "$LEG" '"::error::\($leg) is \(.status | ascii_upcase | sub("_"; " ")), so it is not a pass: \(.not_runnable_reason)"' \
              "harness/out/$LEG/verdict.json"
            [ "$rc" -ne 0 ] || rc=3
          fi
          exit "$rc"
      # Nothing is uploaded unless that scan ran, read at least one file, and found no credential.
      - name: Leak gate
        id: leaks
        if: always()
        run: |
          f="harness/out/$LEG/secrets.json"
          if [ -f "$f" ] && jq -e '.scanned > 0 and .leaks == 0' "$f" > /dev/null; then
            echo "secrets scan: $(jq -c . "$f")"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no clean secrets scan ($( [ -f "$f" ] && jq -c . "$f" || echo "no $f" )): out/ is not uploaded"
            exit 1
          fi
      - name: Verdict
        if: always() && steps.leaks.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verdict-${{ matrix.leg.name }}
          path: harness/out/${{ matrix.leg.name }}/verdict.json
          if-no-files-found: error
          retention-days: 14
      - name: Out
        if: always() && steps.leaks.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ matrix.leg.name }}
          path: harness/out/
          if-no-files-found: error
          retention-days: 14

  table:
    needs: [plan, leg]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # A run whose legs never uploaded a verdict still gets its table: every leg MISSING, and red.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: verdict-*
          path: ${{ runner.temp }}/verdicts
      - name: The table
        env:
          CASES: ${{ inputs.cases || 'all' }}
          # The branch head the legs ran (a PR run's GITHUB_SHA is its merge commit).
          CHAOS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/verdicts"
          rc=0
          harness/run-chaos.sh --table "$RUNNER_TEMP/verdicts" "$CASES" > "$RUNNER_TEMP/table.md" || rc=$?
          cat "$RUNNER_TEMP/table.md"
          cat "$RUNNER_TEMP/table.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

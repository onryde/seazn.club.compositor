name: deploy-stg
# C16 (docs/tasks/C16-deploy.md, amendment 2026-10-25): build the relay image at this commit and push it
# to the stg relay app's registry as <RELAY_REGISTRY>/seazn-relay-stg:<sha>. A push changes nothing live:
# a relay Machine takes an image only when web creates one, from web's RELAY_IMAGE, and RELAY_IMAGE
# changes only through scripts/promote.sh, which the owner (or the coordinator, on the owner's explicit
# go-ahead) runs on their own machine with their own flyctl login (decision log 2026-10-14: the bump is
# explicit, never automatic; 2026-10-25: no GitHub environment, and no web-app token in GitHub).
#
# - The token guard: FLY_API_TOKEN_RELAY_STG unset is a warning and a skipped push, never a red. It is
#   a REPOSITORY secret, minted `fly tokens create deploy -a seazn-relay-stg`, so it reaches that one
#   app (its registry and Machines) and never seazn-club-stg. Any branch's own copy of a workflow can
#   read a repository secret, so a branch can push an image under any tag: the owner accepted that
#   (decision log 2026-10-25). It cannot make the image promotable (main's build record, below). It
#   can also drive the relay app's Machines API, and a live session's Machine carries that session's
#   JOB_TOKEN in its config.env, which unlocks the session's decrypted publish target (a passthrough
#   customer's stream key): the PR #93 review's I-2, recorded in the decision log.
# - Main only: the job runs only on refs/heads/main, and its first step after the gate refuses any other
#   ref. That is hygiene, not a guard: it keeps main's own copy from pushing a branch's commit, and a
#   branch's edited copy drops both.
# - Main's build record (the PR #85 review's I-4): every push is attested (actions/attest: a
#   Sigstore-signed SLSA provenance naming this workflow, refs/heads/main and the commit). A tag found
#   already in the registry is taken only when such an attestation of its digest verifies for this
#   commit; anything else is a squat or a lost record, and a red. scripts/promote.sh verifies the same
#   before it touches the web app, so a squatted image is never promoted.
# - The CEF bump gate (amendment 2026-10-18, Owed 22) runs right after the checkout, so a CEF bump with
#   no recorded C11 Step 0 re-run is never pushed.
# - The build reads and writes no cache: image.yml's GHCR cache is writable by any repository writer
#   (amendment 2026-10-23), so every layer is built from source here.
# - The target is relay and nothing else: never the image that carries the C14 hooks (amendment
#   2026-10-24).
# - A sha already in the registry is never pushed again: promote pins RELAY_IMAGE by digest, and a tag
#   that never moves keeps a rollback's ref meaning what it meant.
# scripts/check-workflows.sh (check.yml) holds this file to all of the above.
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: deploy-stg
  cancel-in-progress: false
defaults:
  run: { shell: bash }
env:
  RELAY_APP: seazn-relay-stg
  # ADR 0007: the one place the registry is named; moving host changes the variable.
  RELAY_REGISTRY: ${{ vars.RELAY_REGISTRY || 'registry.fly.io' }}
  # flyctl, pinned with its release checksum (soak.yml's: superfly/flyctl v0.4.116).
  FLYCTL_VERSION: 0.4.116
  FLYCTL_SHA256: ab929c80ef0c1f7d623052267885632f47b4c5dd7c0ed8383d16f42472abe7b9
jobs:
  push:
    # Hygiene, not a guard: see the header.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A cold CEF build: no cache, by rule.
    timeout-minutes: 90
    # id-token and attestations: main's build record. Nothing else in this repository may sign.
    permissions: { contents: read, id-token: write, attestations: write }
    env:
      TAG: ${{ github.sha }}
      LOCAL_IMAGE: seazn-relay:${{ github.sha }}
    steps:
      # Actions pinned by commit: this job holds a Fly token (image.yml's cache job, the PR #47 review's m7).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: CEF bump gate (Owed 22)
        run: scripts/check-cef-bump.sh
      - name: The ref is main
        id: provenance
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::deploy-stg pushes main only, not $GITHUB_REF: nothing pushed"
            exit 1
          fi
          echo "$GITHUB_REF ($GITHUB_SHA)"
      - name: The Fly push token
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RELAY_STG }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN_RELAY_STG unset (a repository secret: docs/_INDEX.md, the C16 handoff) — push skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      # Every step from here reads the guard, so an unset token skips them all and is never a red.
      # CEF's build tree does not fit the runner's free disk otherwise (image.yml).
      - name: Free disk space
        if: steps.token.outputs.enabled == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        if: steps.token.outputs.enabled == 'true'
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: flyctl
        if: steps.token.outputs.enabled == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flyctl.tgz" \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "$FLYCTL_SHA256  $RUNNER_TEMP/flyctl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/flyctl.tgz" -C "$RUNNER_TEMP/bin" flyctl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Already pushed?
        id: exists
        if: steps.token.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RELAY_STG }}
        run: |
          # The login leaves with this step (the PR #93 review's m-2): no later step, and no third-party
          # action, inherits the token through docker's config.
          trap 'docker logout "$RELAY_REGISTRY" > /dev/null 2>&1 || true' EXIT
          flyctl auth docker
          ref="$RELAY_REGISTRY/$RELAY_APP:$TAG"
          # Only the registry's 404 means absent: containerd's resolver reports it as "<ref>: not
          # found" (it never reads the body, so "manifest unknown" never surfaces). Any other error
          # (auth, network, a 5xx) is a red, never a rebuild that would move the tag.
          if digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2> "$RUNNER_TEMP/inspect.err"); then
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$ref resolved to no manifest digest: '$digest'"
              exit 1
            fi
            # Found is not pushed: "Main's build record" takes it only with main's attestation.
            echo "::notice::$ref was found in the registry, not built by this run ($digest)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -qF "$ref: not found" "$RUNNER_TEMP/inspect.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the registry could not be read for $ref (only 'not found' means not pushed): $(head -c 300 "$RUNNER_TEMP/inspect.err")"
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.token.outputs.enabled == 'true' && steps.exists.outputs.exists != 'true'
      - name: Build the relay image
        if: steps.token.outputs.enabled == 'true' && steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: relay
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
      - name: Push
        id: push
        if: steps.token.outputs.enabled == 'true' && steps.exists.outputs.exists != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RELAY_STG }}
        run: |
          # The login leaves with this step (the PR #93 review's m-2): no later step, and no third-party
          # action, inherits the token through docker's config.
          trap 'docker logout "$RELAY_REGISTRY" > /dev/null 2>&1 || true' EXIT
          flyctl auth docker
          ref="$RELAY_REGISTRY/$RELAY_APP:$TAG"
          docker tag "$LOCAL_IMAGE" "$ref"
          docker push "$ref" | tee "$RUNNER_TEMP/push.out"
          # The digest this push wrote, from docker's own PushResult line (`<tag>: digest: <d> size: <n>`),
          # never read back by tag (the PR #93 review's C-1): any branch holding the repository token can
          # move the tag between the push and a read, and the attest step signs whatever this outputs.
          lines=$(grep -cE "^$TAG: digest: sha256:[0-9a-f]{64} size: [0-9]+$" "$RUNNER_TEMP/push.out" || true)
          if [ "$lines" != 1 ]; then
            echo "::error::docker push printed $lines digest lines for $ref, not 1: nothing attested"
            exit 1
          fi
          digest=$(sed -nE "s/^$TAG: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p" "$RUNNER_TEMP/push.out")
          # The tag read back only as a race check: if it no longer names this push, another push moved
          # it under this one, and the run stops before it attests anything.
          now=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          if [ "$now" != "$digest" ]; then
            echo "::error::the tag moved under the push: this run pushed $ref as $digest, and the tag now names '$now'. Another push holds the token (a squat): nothing attested; the owner must resolve it"
            exit 1
          fi
          echo "pushed $ref ($digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Main's build record: signed with this run's OIDC identity (this workflow's path at
      # refs/heads/main, this commit), which no other ref's run can sign as. Kept in GitHub's
      # attestation API, never in the registry.
      - name: Attest the push
        id: attest
        if: steps.token.outputs.enabled == 'true' && steps.exists.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.RELAY_REGISTRY }}/${{ env.RELAY_APP }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      # Both paths: the digest this run pushed, or the one it found, must verify as main's own build
      # of this commit. A found tag that does not is a squat (or a push whose record never landed),
      # and nothing downstream may take it. Its `if` is the token guard's alone, never the found path's.
      - name: Main's build record
        id: record
        if: steps.token.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RELAY_STG }}
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest || steps.exists.outputs.digest }}
          FOUND: ${{ steps.exists.outputs.exists }}
        run: |
          # The login leaves with this step (the PR #93 review's m-2): no later step, and no third-party
          # action, inherits the token through docker's config.
          trap 'docker logout "$RELAY_REGISTRY" > /dev/null 2>&1 || true' EXIT
          flyctl auth docker
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/deploy-stg.yml@refs/heads/main"
          ref="$RELAY_REGISTRY/$RELAY_APP:$TAG"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $ref: '$DIGEST'"; exit 1; }
          if gh attestation verify "oci://$RELAY_REGISTRY/$RELAY_APP@$DIGEST" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners --limit 1000 > "$RUNNER_TEMP/attest.out" 2>&1; then
            echo "$ref@$DIGEST: attested by $identity for $GITHUB_SHA"
          elif [ "$FOUND" = true ]; then
            echo "::error::$ref is in the registry ($DIGEST) but is not main's own build: no attestation from $identity for $GITHUB_SHA. A squat, or a push whose record never landed: nothing pushed, nothing to promote; the owner must resolve it (the next commit on main gets a tag of its own). $(tail -c 300 "$RUNNER_TEMP/attest.out")"
            exit 1
          else
            echo "::error::this run's push of $ref ($DIGEST) has no attestation that verifies, so scripts/promote.sh would refuse it: $(tail -c 300 "$RUNNER_TEMP/attest.out")"
            exit 1
          fi
      - name: Summary
        id: summary
        if: steps.token.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.exists.outputs.digest }}
          FOUND: ${{ steps.exists.outputs.exists }}
        run: |
          ref="$RELAY_REGISTRY/$RELAY_APP:$TAG"
          {
            echo "## Relay image, stg"
            echo
            if [ "$FOUND" = true ]; then
              echo "Found in the registry, not built by this run: \`$ref\` (\`$DIGEST\`), attested earlier as main's build of $TAG. Nothing pushed, nothing live changed."
            else
              echo "Pushed and attested as main's build of $TAG: \`$ref\` (\`$DIGEST\`). Nothing live changed."
            fi
            echo
            echo "Promote it on the owner's go-ahead (stg's web app takes it for every new session; not run), from a checkout of main, logged in to flyctl as yourself:"
            echo
            echo '```'
            echo "scripts/promote.sh stg $TAG@$DIGEST"
            echo '```'
            echo
            echo "The digest is required: promote reads that manifest by its digest, and refuses unless main's attestation of it verifies."
            echo
            echo "It stages \`RELAY_IMAGE=$RELAY_REGISTRY/$RELAY_APP@$DIGEST\` (the digest alone) on seazn-club-stg, then deploys it."
          } >> "$GITHUB_STEP_SUMMARY"

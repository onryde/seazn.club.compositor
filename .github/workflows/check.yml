name: check
on:
  push: { branches: [main] }
  pull_request: {}
  # A proof run only: `apt_blackhole` points every mirror in the runner's list at an address nothing
  # answers, so the GStreamer step must fail on its own bound, with its own error.
  workflow_dispatch:
    inputs:
      apt_blackhole:
        description: "Blackhole the apt mirrors (the GStreamer step must fail inside its bound)"
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      # An explicit `shell: bash` runs `bash -eo pipefail`. The implicit default is `bash -e` with no
      # pipefail, under which `cargo test … | tee` exits with tee's 0 and a failing suite passes.
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - name: Portability guard (ADR 0007)
        run: scripts/check-portable.sh
      # image.yml's GHCR cache scripts: the key changes with the CEF pin, the gst-base and cef-build
      # stages and their base's digest, and with no other line (scripts/cef-cache-key.sh); the tree check
      # (scripts/cef-cache-holds-tree.sh); the writer builds what the readers read; the timing table's
      # log parser (scripts/cache_timing.py).
      - name: GHCR cache scripts
        run: |
          python3 -I scripts/cef_cache_key_test.py
          python3 -I scripts/cache_timing.py --self-test
      # scripts/apt-install.sh: the retries, the per-attempt bounds and the mirror fallback, under fakes.
      - name: apt install script
        run: python3 -I scripts/apt_install_test.py
      - name: Blackhole the apt mirrors (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apt_blackhole }}
        run: |
          hosts=$(awk -F/ '/^https?:/ {print $3}' /etc/apt/apt-mirrors.txt | sort -u | tr '\n' ' ')
          echo "10.255.255.1 $hosts" | sudo tee -a /etc/hosts
      # The programme and output pipelines (C09) build against GStreamer and test against its
      # plugins: x264enc (ugly), flvmux/rtmp2sink/pngdec (good/bad), avdec_* (libav, decode-back only).
      # A trickling mirror once held this step for 22 to 25 minutes and the job's bound cancelled the
      # run (decision log, 2026-10-23); the script fails on its own inside 10 (worst case 490 s).
      - name: GStreamer
        timeout-minutes: 10
        run: scripts/apt-install.sh libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.91.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # C11 (PR #32 review m4): `tests/graphics.rs` RUNS only where cefsrc is (the C12 image), but it
      # compiles wherever GStreamer does, so a change that breaks it reds here first.
      - run: cargo clippy -p adapters --features cef --all-targets -- -D warnings
      # --show-output prints each guard's "checked N" line on a passing run, too.
      - run: cargo test --workspace --no-fail-fast -- --show-output 2>&1 | tee test.log
      - name: Refuse a vacuous run
        run: |
          total=$({ grep -Eo 'test result: ok\. [0-9]+ passed' test.log || true; } | awk '{s+=$4} END {print s+0}')
          ignored=$({ grep -E 'test result: ' test.log || true; } | { grep -Eo '[0-9]+ ignored' || true; } \
            | awk '{s+=$1} END {print s+0}')
          echo "tests passed: $total, ignored: $ignored"
          # Every check reports before the step fails, so one run names every reason.
          fail=0
          if [ "$total" -le 0 ]; then
            echo "::error::0 tests passed: a vacuous run"
            fail=1
          fi
          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored test(s) ignored: an ignored guard guards nothing"
            fail=1
          fi
          # Each layering guard, and the fixture test pinning the graph code two of them share, must
          # have run AND passed by name, so a renamed, deleted or skipped one cannot hide behind the total.
          for guard in domain_source_has_no_clock_env_fs_net_thread_or_process domain_has_no_io_dependencies \
            app_dependency_graph_has_no_adapters app_sources_never_name_adapters \
            graph_closure_follows_edge_kinds_at_and_past_the_root; do
            if grep -Fq "test $guard ... ok" test.log; then
              echo "guard passed: $guard"
            else
              echo "::error::guard did not pass: $guard"
              fail=1
            fi
          done
          exit "$fail"
      # docker/supervise.sh, the image's stop forwarding (F-016), with a stub child under the image's
      # bash (Ubuntu 24.04's): the PR #36 review's I2 and m1. --require-procfs: the held-stop cases
      # need /proc, so a skip is a failure here. 500 races (about 4 minutes), 400 of them with the INT
      # +0 to +3 ms after the child's exit, where every lost status printed so far landed (F-019).
      # Measured at the old +-15 ms draw: round 1's supervision (mutant 37) lost 2 of 150, then 1 of
      # 500 (PR #45), so 500 clean races came by luck in about 1 run in 3 to 1 in 10 (not "1 in 800");
      # c080c3f's loop (mutant 35) lost 5 of 500. The new draw's rate is the round-3 mutant PR's to
      # measure (Owed 75). Last, and after a red above too, so neither hides the other.
      - name: Entrypoint stop supervision
        if: ${{ !cancelled() }}
        run: python3 -I scripts/supervise_test.py --bash /bin/bash --require-procfs --races 500

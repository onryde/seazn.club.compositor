name: check
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      # An explicit `shell: bash` runs `bash -eo pipefail`. The implicit default is `bash -e` with no
      # pipefail, under which `cargo test … | tee` exits with tee's 0 and a failing suite passes.
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - name: Portability guard (ADR 0007)
        run: scripts/check-portable.sh
      # docker/supervise.sh, the image's stop forwarding (F-016), with a stub child under the image's
      # bash (Ubuntu 24.04's): the PR #36 review's I2 and m1. --require-procfs: the held-stop cases
      # need /proc, so a skip is a failure here. 500 races (about 3 minutes): round 1's supervision
      # lost the child's status in 2 of 150 here; at that rate 500 clean races happen by luck about
      # once in 800 runs. Last, and after a red above too, so neither hides the other.
      - name: "mutant 37 (round 1's supervise)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 -I scripts/supervise_test.py --script docker/supervise.mut37.sh --bash /bin/bash --require-procfs --races 500
      - name: "mutant 35 (c080c3f's loop)"
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: python3 -I scripts/supervise_test.py --script docker/supervise.mut35.sh --bash /bin/bash --require-procfs --races 500
      - name: "mutant 38 (the child's stdout into the pipe)"
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: python3 -I scripts/supervise_test.py --script docker/supervise.mut38.sh --bash /bin/bash --require-procfs --races 20

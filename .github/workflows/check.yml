name: check
# DO NOT MERGE (C12 round-3 mutants): supervise_test.py's new race draw against mutant 37 (round 1's
# trapped `wait`) three times and mutant 35 (c080c3f's loop) once, each with the killed-by line kept so
# only the wait design differs. Each leg expects red, attributed by line: the run fails AND its races
# line is a FAIL.
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
jobs:
  races:
    name: ${{ matrix.leg.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    strategy:
      fail-fast: false
      matrix:
        leg:
          - { name: "mutant 37, run 1 of 3", script: docker/supervise.mut37.sh }
          - { name: "mutant 37, run 2 of 3", script: docker/supervise.mut37.sh }
          - { name: "mutant 37, run 3 of 3", script: docker/supervise.mut37.sh }
          - { name: "mutant 35, run 1 of 1", script: docker/supervise.mut35.sh }
    steps:
      - uses: actions/checkout@v4
      - name: "${{ matrix.leg.name }}: expect the races red"
        env:
          SCRIPT: ${{ matrix.leg.script }}
        run: |
          set +e
          python3 -I scripts/supervise_test.py --script "$SCRIPT" --bash /bin/bash --require-procfs --races 500 > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          echo "supervise_test exit: $code"
          echo "the races line:"
          grep -E '^(FAIL|ok  ) bash .*: 500 races' out.txt || true
          echo "other FAIL lines:"
          grep -E '^FAIL' out.txt | grep -Ev ': 500 races' || true
          if [ "$code" -eq 0 ]; then echo "::error::SURVIVED: the run passed"; exit 1; fi
          if ! grep -Eq '^FAIL bash .*: 500 races' out.txt; then echo "::error::red, but not on the races"; exit 1; fi
          echo "KILLED on the races"

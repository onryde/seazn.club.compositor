name: image
# The relay image (C12 Step 8): build it, check its plugins, run C11's graphics tests beside a real
# cefsrc, smoke the binary in fake mode (exit 0, and C11b's exit 75), probe one live-mode run, cap
# the size, and check that its binary carries no test hook (Owed 82). This workflow never pushes an
# image: pushing is C16's job. The one thing it pushes is BuildKit's layer cache (decision log "CI:
# CEF layer from GHCR"): the `cache` job, on a push to main or a fill dispatch only, writes the
# cache manifest and the layers of the runtime target's stages (gst-base, cef-build, rust-build, the
# runtime; never cef-test's own, never a runnable image) to
# ghcr.io/<owner>/seazn-relay-cache:cef-<key> (the key: scripts/cef-cache-key.sh). `image` reads it
# with a read-only token wherever that token may (the package is private; a fork PR's read is
# unverified); a cache that is missing, unreadable or without the CEF tree is a miss, never a
# failure. The cache is CI-only and untrusted for shipping: any repository writer can write the tag
# (C16 never reads it).
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch:
    inputs:
      measure:
        description: >-
          fill: write and check the cache from this ref (the cache job alone). ghcr or gha: a timing
          run for the decision row's table: no write; it waits for a fill to land, rebuilds rust-build
          as a new commit would, reads GHCR alone or GitHub's cache alone (the old path), and ends after
          the two build steps.
        type: choice
        options: [fill, ghcr, gha]
        default: fill
# Fill dispatches on one ref queue behind each other, so a fill then a run reads warm. GitHub keeps
# one running and ONE pending run per group: a third fill on a ref cancels the pending second. Timing
# runs and every other run have a group of their own, so a timing batch runs side by side.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.measure == 'fill' && format('image-dispatch-{0}', github.ref) || format('image-{0}', github.run_id) }}
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  image:
    # A fill dispatch writes and checks the cache in the `cache` job alone (owner, 2026-10-23, relayed:
    # "cut measure runs after build steps"); every push, PR and timing run has this job.
    if: github.event_name != 'workflow_dispatch' || inputs.measure != 'fill'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Read only, on every event: this job never writes the registry.
    permissions: { contents: read, packages: read }
    defaults:
      # `bash -eo pipefail`: the implicit default has no pipefail (check.yml's note).
      run: { shell: bash }
    env:
      IMAGE: seazn-relay:${{ github.sha }}
      TEST_IMAGE: seazn-relay-cef-test:${{ github.sha }}
      HOOKS_IMAGE: seazn-relay-test-hooks:${{ github.sha }}
      # The fake runs' dummy job facts: a token that is no secret, so the log check means something.
      DUMMY_TOKEN: dummy-job-token-not-a-secret-4c1e
      DUMMY_SID: 3f8a2c1e-7b4d-4e9a-9c2f-5d6e7f8a9b0c
      # A timing run ends after "Build the cef-test stage": every later step carries
      # `if: env.TIMING != 'true'`, which holds on every push and PR (inputs.measure is empty there);
      # scripts/cef_cache_key_test.py checks that the full list still runs then.
      TIMING: ${{ inputs.measure == 'ghcr' || inputs.measure == 'gha' }}
    steps:
      - uses: actions/checkout@v4
      # CEF's build tree and two images do not fit the runner's free disk otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # The GHCR build cache, which the `cache` job writes. A failed login is a cold cache too.
      - name: Log in to GHCR (read)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cache (GHCR, read)
        id: cache
        env:
          MEASURE: ${{ inputs.measure }}
        run: |
          # Warm: a tag whose manifest holds the cef-build tree (scripts/cef-cache-holds-tree.sh); read GHCR
          # alone. Cold (no key, no tag, an unreadable one, one without the tree): GitHub's cache as well,
          # read and written as before, so the run falls back instead of failing. Never both on a warm run:
          # BuildKit merges its importers' records concurrently and the first to answer serves a layer
          # they share (solver/combinedcache.go, Records), which could pull the CEF tree from GitHub's.
          ref=
          if key=$(scripts/cef-cache-key.sh 2> "$RUNNER_TEMP/cache-key.err"); then
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seazn-relay-cache:cef-$key"
          else
            echo "::warning::no cache key, so a cold cache: $(head -c 300 "$RUNNER_TEMP/cache-key.err")"
          fi
          probe() {
            [ -n "$ref" ] \
              && docker buildx imagetools inspect --raw "$ref" > "$RUNNER_TEMP/cache.json" 2> "$RUNNER_TEMP/cache-probe.err" \
              && scripts/cef-cache-holds-tree.sh "$RUNNER_TEMP/cache.json" 2>> "$RUNNER_TEMP/cache-probe.err"
          }
          case "$MEASURE" in
            ghcr | gha)
              # A timing run: wait for the batch's fill to land, so the batch shares one window; then a
              # file in the build context, so rust-build's `COPY . .` and all after it rebuild, as on a
              # new commit (the context has no target/, so cargo builds from scratch either way).
              for i in $(seq 1 90); do
                probe && break
                [ "$i" -lt 90 ] || { echo "::error::no warm cache at '${ref:-none}' after 30 minutes: nothing to time"; exit 1; }
                sleep 20
              done
              echo "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" > .ci-timing-run
              if [ "$MEASURE" = ghcr ]; then
                state="warm, timing ghcr"; from="type=registry,ref=$ref"; to=
              else
                state="gha, timing gha"; from="type=gha"; to="type=gha,mode=max"
              fi
              ;;
            *)
              if probe; then
                state=warm; from="type=registry,ref=$ref"; to=
              else
                state=cold
                [ -z "$ref" ] || echo "cache probe: $(head -c 300 "$RUNNER_TEMP/cache-probe.err" 2> /dev/null)"
                from="type=gha"
                [ -z "$ref" ] || from="type=registry,ref=$ref"$'\n'"type=gha"
                to="type=gha,mode=max"
              fi
              ;;
          esac
          echo "build cache: ${ref:-none} ($state)"
          { echo "from<<EOF"; echo "$from"; echo "EOF"; echo "to=$to"; } >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      - name: Build the cef-test stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: cef-test
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.TEST_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      - name: Plugin check
        if: env.TIMING != 'true'
        run: docker run --rm --entrypoint gst-inspect-1.0 "$IMAGE" cefsrc > /dev/null
      - name: Runs as non-root, with no CEF log override
        if: env.TIMING != 'true'
        run: |
          user=$(docker inspect -f '{{.Config.User}}' "$IMAGE")
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "image user: $user, uid $uid"
          [ "$user" = "relay" ] && [ "$uid" = "10001" ]
          env=$(docker inspect -f '{{json .Config.Env}}' "$IMAGE")
          echo "image env: $env"
          if grep -Eq '"(GST_CEF_LOG_SEVERITY|GST_DEBUG)=' <<<"$env"; then
            echo "::error::the image sets GST_CEF_LOG_SEVERITY or GST_DEBUG (Owed 52)"
            exit 1
          fi
          # tini would signal the compositor directly, around supervise.sh (F-016; PR #36 review m6).
          if grep -Eq '"TINI_KILL_PROCESS_GROUP=' <<<"$env"; then
            echo "::error::the image sets TINI_KILL_PROCESS_GROUP"
            exit 1
          fi
      - name: C11's graphics tests beside cefsrc
        if: env.TIMING != 'true'
        run: |
          docker volume create relay-target > /dev/null
          docker run --rm -v relay-target:/src/target "$TEST_IMAGE" bash -c '
            Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > /dev/null 2>&1 &
            for _ in $(seq 1 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
            cargo test --locked -p adapters --features cef --test graphics -- --test-threads=1 --show-output
            debug=$?
            # Owed 70 (a), the PR #55 review I3: the GPU crash loops again on the release profile, the
            # one the compositor is built with (docker/Dockerfile: `cargo build --release`), for the
            # listing cost the production GPU watch paces on (the debug run above prints its own).
            cargo test --release --locked -p adapters --features cef --test graphics a_gpu_crash_loop \
              -- --test-threads=1 --show-output
            release=$?
            exit $(( debug || release ))
          ' 2>&1 | tee graphics.log
          passed=$({ grep -Eo 'test result: ok\. [0-9]+ passed' graphics.log || true; } | awk '{s+=$4} END {print s+0}')
          echo "graphics tests passed: $passed"
          # The brief's floor (C11's eight, amended 2026-10-15); the file holds more.
          if [ "$passed" -lt 8 ]; then
            echo "::error::$passed graphics tests passed, fewer than 8"
            exit 1
          fi
          # A filter that matched nothing passes 0 tests: the release run must have run both loops
          # (the 40 ms one and the shortest relaunch life's).
          loops=$({ grep -E '^gpu loop child \(release build\)' graphics.log || true; } | wc -l)
          echo "GPU crash loops on the release profile: $loops"
          if [ "$loops" -lt 2 ]; then
            echo "::error::$loops GPU crash loops ran on the release profile, fewer than 2"
            exit 1
          fi
      - name: Smoke budget
        if: env.TIMING != 'true'
        id: budget
        run: |
          budget=$(docker run --rm -v relay-target:/src/target "$TEST_IMAGE" \
            cargo run -q --locked -p compositor --example smoke_budget)
          if ! [[ "$budget" =~ ^[0-9]+$ ]]; then
            echo "::error::smoke_budget printed '$budget', not a number"
            exit 1
          fi
          echo "smoke budget: $budget ms"
          echo "ms=$budget" >> "$GITHUB_OUTPUT"
      - name: 60 s fake smoke
        if: env.TIMING != 'true'
        env:
          BUDGET_MS: ${{ steps.budget.outputs.ms }}
        run: |
          deadline=$(date -u -d '+60 seconds' +%Y-%m-%dT%H:%M:%S.000Z)
          set +e
          timeout "$(( (BUDGET_MS + 999) / 1000 ))s" docker run --rm --name relay-smoke \
            -e COMPOSITOR_DRIVERS=fake -e SESSION_ID="$DUMMY_SID" -e JOB_TOKEN="$DUMMY_TOKEN" \
            -e APP_URL=https://app.example -e RELAY_DEADLINE_AT="$deadline" "$IMAGE" 2> smoke.log
          code=$?
          set -e
          docker rm -f relay-smoke > /dev/null 2>&1 || true
          cat smoke.log
          echo "smoke exit: $code"
          [ "$code" -eq 0 ]
          grep -q 'msg=programme started' smoke.log
          grep -q 'msg=exit code=0' smoke.log
          if grep -qF "$DUMMY_TOKEN" smoke.log; then echo "::error::the token reached stderr"; exit 1; fi
      - name: Exit 75 smoke (C11b, a dead CEF zygote)
        if: env.TIMING != 'true'
        run: |
          deadline=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%S.000Z)
          set +e
          timeout 60s docker run --rm --name relay-smoke-75 \
            -e COMPOSITOR_DRIVERS=fake -e COMPOSITOR_FAKE_ZYGOTE_GONE=1 -e SESSION_ID="$DUMMY_SID" \
            -e JOB_TOKEN="$DUMMY_TOKEN" -e APP_URL=https://app.example -e RELAY_DEADLINE_AT="$deadline" \
            "$IMAGE" 2> smoke75.log
          code=$?
          set -e
          docker rm -f relay-smoke-75 > /dev/null 2>&1 || true
          cat smoke75.log
          echo "exit-75 smoke exit: $code"
          [ "$code" -eq 75 ]
          grep -q 'msg=cef health zygote_gone=1 ' smoke75.log
          grep -q 'msg=exit code=75' smoke75.log
      # Phase B repeats a live exit with CEF up 32 times, 24 of them stops, at both profiles (F-017:
      # before hard_exit::now, 1 in 6 such exits aborted after their exit line here, and 6 of 12
      # stops on a Fly Machine). About 8 minutes.
      - name: Live-mode probe (no core, TMPDIR, 32 live exits)
        if: env.TIMING != 'true'
        timeout-minutes: 25
        run: python3 -I scripts/image_probe.py "$IMAGE" --keep-log probe.log --exits 32
      - name: Image size
        if: env.TIMING != 'true'
        run: |
          bytes=$(docker image inspect -f '{{.Size}}' "$IMAGE")
          echo "image size: $bytes bytes ($(( bytes / 1048576 )) MiB)"
          cap=$(( 2500 * 1000 * 1000 ))
          if [ "$bytes" -gt "$cap" ]; then
            echo "::error::the image is $bytes bytes, over the 2.5 GB cap"
            exit 1
          fi
      # Owed 82 (owner option A, 2026-10-24): C14 case 16's image, the relay image with the binary
      # built with its `test-hooks` feature (the held-teardown hook). Built here so the check below has
      # its positive pair; rust-build's layers come from "Build the image".
      - name: Build the relay-test-hooks stage (Owed 82)
        if: env.TIMING != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: relay-test-hooks
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.HOOKS_IMAGE }}
          load: true
          push: false
          cache-from: ${{ steps.cache.outputs.from }}
      # The shipped binary has no test hook: no byte of the hook's env key or of its log line is in
      # the relay image's compositor, and both are in relay-test-hooks' (so the read is not vacuous:
      # a marker the hooks build lacks is a red, not a pass).
      - name: The relay image carries no test hook (Owed 82)
        if: env.TIMING != 'true'
        run: |
          docker run --rm --entrypoint cat "$IMAGE" /usr/local/bin/compositor > relay.bin
          docker run --rm --entrypoint cat "$HOOKS_IMAGE" /usr/local/bin/compositor > hooks.bin
          for b in relay.bin hooks.bin; do
            magic=$(head -c 4 "$b" | od -An -tx1 | tr -d ' \n')
            echo "$b: $(wc -c < "$b") bytes, magic $magic"
            if [ "$magic" != 7f454c46 ]; then
              echo "::error::$b is not an ELF binary"
              exit 1
            fi
          done
          checked=0
          for marker in COMPOSITOR_TEST_HOLD_TEARDOWNS 'test hook (Owed 82)' \
            COMPOSITOR_TEST_HOLD_SINK_AFTER_MS COMPOSITOR_TEST_HANG_SINK_AFTER_MS 'test hook (Owed 94)' \
            COMPOSITOR_TEST_WITHHOLD_PAGES 'test hook (Owed 99)'; do
            relay=$(grep -a -F -c -- "$marker" relay.bin || true)
            hooks=$(grep -a -F -c -- "$marker" hooks.bin || true)
            echo "marker '$marker': relay ${relay:-?}, relay-test-hooks ${hooks:-?}"
            if ! [ "${hooks:-0}" -ge 1 ]; then
              echo "::error::the relay-test-hooks binary has no '$marker': this check would read nothing"
              exit 1
            fi
            if [ "${relay:-1}" != 0 ]; then
              echo "::error::the relay image's binary carries the test hook ('$marker')"
              exit 1
            fi
            checked=$((checked + 1))
          done
          echo "test-hook markers checked: $checked"
          [ "$checked" -eq 7 ]
      # Owed 85 (F-025): Docker's restart in place (`--restart on-failure`, ADR 0007 item 5) keeps the
      # container's writable layer, /tmp included, as compose's does in C14. Each exit C14 saw restarted
      # (75, 133, 137) must come back with CEF ready, one Xvfb with -displayfd, no X lock and its socket
      # listening: 6 restarts, two per container, each kind twice. Measured 13 s for 3 restarts (run
      # 40058946304) and 18 s for 4 (run 40057826178); the probe's own waits bound it near 11 minutes.
      # Last, and run whatever an earlier step found (`!cancelled()`), so its red hides no other C12 check
      # and no other red hides it (the PR #54 review's I3); scripts/cef_cache_key_test.py checks both.
      - name: In-place restart probe (Owed 85, CEF ready after 75, 133 and 137)
        if: ${{ !cancelled() && env.TIMING != 'true' }}
        timeout-minutes: 15
        run: python3 -I scripts/image_probe.py "$IMAGE" --keep-log restart.log --restarts 6
      - name: Logs
        if: always() && env.TIMING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-logs
          path: |
            graphics.log
            smoke.log
            smoke75.log
            probe.log
            restart.log
          if-no-files-found: ignore

  # Writes the build cache `image` reads: BuildKit's cache manifest and the layers of the runtime
  # target's stages (mode=max: the cef-build tree that the cef-test stage pulls is an intermediate
  # layer), never a runnable image (output cacheonly). Only on a push to main and a fill dispatch;
  # never on a pull request from this file. Trust (the PR #47 review's I-1): that does not make the tag
  # main's alone. A dispatch runs the dispatched ref's copy of this file, and a same-repository PR's
  # own copy can ask for `packages: write`, so any repository writer can put any manifest at
  # `cef-<key>`, and BuildKit serves a cached layer without rebuilding it. Fine for CI, which ships
  # nothing; C16's deploy builds never read this cache (C16 brief, amendment 2026-10-23).
  # Actions pinned by commit (the review's m7): this job holds a write token.
  cache:
    # `inputs` is empty on a push and a pull request, so `inputs.measure == 'fill'` is a fill dispatch alone;
    # no parentheses, so scripts/cef_cache_key_test.py evaluates this guard per event (confirm pass c-2).
    if: github.event_name == 'push' || inputs.measure == 'fill'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read, packages: write }
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No token left in .git/config (.dockerignore drops .git too): nothing this job pushes can carry it.
        with: { persist-credentials: false }
      # A cold key builds CEF from source, as `image` does.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR (write)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cache (GHCR, write)
        id: cache
        run: |
          key=$(scripts/cef-cache-key.sh)
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seazn-relay-cache:cef-$key"
          echo "build cache: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # `image`'s own "Build the image" (the same context, file, build args and target, which
      # scripts/cef_cache_key_test.py checks), so these are the cache keys it looks up. GitHub's cache is
      # read too, for a key's first fill.
      - name: Write the build cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.ref }}
            type=gha
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max
      # The write landed, and it holds the cef-build tree: a cache without it sends every cef-test build
      # back to a CEF rebuild (scripts/cef-cache-holds-tree.sh; `image` asks the same before it reads).
      - name: The cache holds the CEF tree
        env:
          REF: ${{ steps.cache.outputs.ref }}
        run: |
          docker buildx imagetools inspect --raw "$REF" > "$RUNNER_TEMP/cache.json"
          # An assignment, so the check's exit fails the step (inside echo's arguments it would not).
          summary=$(scripts/cef-cache-holds-tree.sh "$RUNNER_TEMP/cache.json")
          echo "cache $REF: $summary"

name: image
# The relay image (C12 Step 8): build it, check its plugins, run C11's graphics tests beside a real
# cefsrc, smoke the binary in fake mode (exit 0, and C11b's exit 75), probe one live-mode run, and cap
# the size. This workflow never pushes an image: pushing is C16's job.
on:
  push: { branches: [main] }
  pull_request: {}
permissions: { contents: read }
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      # `bash -eo pipefail`: the implicit default has no pipefail (check.yml's note).
      run: { shell: bash }
    env:
      IMAGE: seazn-relay:${{ github.sha }}
      TEST_IMAGE: seazn-relay-cef-test:${{ github.sha }}
      # The fake runs' dummy job facts: a token that is no secret, so the log check means something.
      DUMMY_TOKEN: dummy-job-token-not-a-secret-4c1e
      DUMMY_SID: 3f8a2c1e-7b4d-4e9a-9c2f-5d6e7f8a9b0c
    steps:
      - uses: actions/checkout@v4
      # CEF's build tree and two images do not fit the runner's free disk otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha
      # DO NOT MERGE (C12 round-3 mutants): mutant 29, `remove_var(JOB_TOKEN)` deleted in main.rs.
      # Expect red, attributed by line: the probe fails, on the exec-time witness's JOB_TOKEN line, and
      # on no other line. --exits 8: phase B is unrelated to the token; fewer exits, fewer chances of an
      # unrelated red muddying the attribution.
      - name: "Mutant 29: expect the exec-time witness red, and nothing else"
        timeout-minutes: 25
        run: |
          set +e
          python3 -I scripts/image_probe.py "$IMAGE" --keep-log probe.log --exits 8 > probe.out 2>&1
          code=$?
          set -e
          cat probe.out
          echo "probe exit: $code"
          fails=$(grep -c '^FAIL ' probe.out || true)
          target=$(grep -c "^FAIL no JOB_TOKEN at any CEF child's exec" probe.out || true)
          echo "FAIL lines: $fails; on the witness's JOB_TOKEN line: $target"
          grep '^FAIL ' probe.out || true
          if [ "$code" -eq 0 ]; then echo "::error::mutant 29 SURVIVED: the probe passed"; exit 1; fi
          if [ "$target" -lt 1 ]; then echo "::error::red, but not on the witness's JOB_TOKEN line"; exit 1; fi
          if [ "$fails" -ne "$target" ]; then echo "::error::other probe lines went red too"; exit 1; fi
          echo "mutant 29 KILLED, on the exec-time witness alone"
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-logs
          path: |
            probe.out
            probe.log
          if-no-files-found: ignore

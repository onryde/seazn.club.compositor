name: harness
# The harness (C13): build the relay image and the harness image from docker/Dockerfile, run one
# case of harness/run-case.sh against them (the smoke case on a pull request), and upload out/.
# This is the only place the compose stack runs (owner ruling 2026-10-23: no local Docker).
# Dispatchable, so a throwaway mutant branch can run a case too.
on:
  pull_request:
    paths:
      - "crates/**"
      - "harness/**"
      - "docker/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/harness.yml"
  workflow_dispatch:
    inputs:
      case:
        description: "The case to run: harness/cases/<case>.sh"
        required: true
        default: smoke
permissions: { contents: read }
concurrency:
  group: harness-${{ github.event_name }}-${{ github.ref }}
  # A pull request's newer push replaces its older run; a dispatched run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      # `bash -eo pipefail`: the implicit default has no pipefail (check.yml's note).
      run: { shell: bash }
    env:
      RELAY_IMAGE: seazn-relay:${{ github.sha }}
      HARNESS_IMAGE: seazn-harness:${{ github.sha }}
      CASE: ${{ inputs.case || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - name: The case name
        run: |
          if ! [[ "$CASE" =~ ^[a-z0-9-]+$ ]] || [ ! -f "harness/cases/$CASE.sh" ]; then
            echo "::error::no case '$CASE' in harness/cases"
            exit 1
          fi
          echo "case: $CASE"
      # CEF's build tree and two images do not fit the runner's free disk otherwise (image.yml).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: gstcefsrc pin (F-001)
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < docker/GSTCEF_COMMIT)
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/GSTCEF_COMMIT is not a 40-hex commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # image.yml's build, reading its cache (image.yml writes it; this workflow never does).
      - name: Build the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.RELAY_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
      - name: Build the harness image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: harness
          build-args: GSTCEF_COMMIT=${{ steps.pin.outputs.commit }}
          tags: ${{ env.HARNESS_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
      # netem.sh's qdiscs and filter: loaded on the host kernel, which every container shares.
      - name: Kernel modules for netem
        run: |
          sudo modprobe -a sch_prio sch_netem cls_u32 || echo "modprobe failed: netem.sh's check will say whether tc works"
          lsmod | grep -E '^(sch_prio|sch_netem|cls_u32)' || true
      - name: Run the case
        run: harness/run-case.sh "$CASE" 2>&1 | tee "harness-$CASE.log"
      - name: Out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ env.CASE }}
          path: |
            harness/out/
            harness-${{ env.CASE }}.log
          if-no-files-found: ignore
          retention-days: 14

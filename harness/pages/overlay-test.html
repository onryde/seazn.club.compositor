<!doctype html>
<!-- C11's harness overlay page (crates/adapters/tests/graphics.rs; C14 and C15 load it too).

     What it draws, on a transparent 1920x1080 body:
       - an opaque test square, #0000ff, 100x100 at the top-left (the tests sample (50,50));
       - a white patch at 50 % opacity, 200x100 at (100,300): cefsrc's alpha is premultiplied
         (F-001: it reads (128,128,128,128)), so the adapter's straight-alpha slot reads it as
         (255,255,255,128);
       - a frame-counter strip along the top that repaints every animation frame, so cefsrc keeps
         emitting buffers (F-001: it emits only on paint).
     The centre (960,540) stays transparent.

     Served at the session fixture's own path, /overlay/fixtures/<id> (C13: fake-control serves it
     there, since the harness's session rewrite keeps the fixture's path), it also draws the SCORE
     STRIP the checker reads (crates/harness/src/score.rs): 16 opaque cells of 24x24 at the top
     right (x 1536..1920, y 0), black or white, the current score index PLUS ONE (u16, most
     significant bit first), so that index 0 never draws as 16 black cells, which a black slate also
     shows. The index is that of the latest event of /score.json whose `at + delay` is not after the
     page's clock (`delay` is the URL's `delay=`, the session's overlayDelayMs); 0 before the
     first. The page polls /score.json every second and keeps the last good answer while the feed is
     down (503). Loaded anywhere else (C11's graphics tests from file:// and from
     /overlay-test.html, image.yml's probe) it draws no strip and fetches nothing.

     At the fixture's path it also polls /page-control.json (C14), which fake-control serves:
       - `hang: true`, once, after `POST /control/page-hang` (case 11, cef-hung): the page
         console.warns `hang starts` and blocks in `while (true) {}`, as crash=1 does. A query
         switch cannot reach this page: the session's overlayUrl is the vendored fixture's, and
         fake-control refuses a rewrite that changes its query;
       - `stale_after_ms` (the budget, spec §6 page side) and `poll_ms`: the score-stale rule the
         real page keeps (R2005's line form). After `stale_after_ms` with no good /score.json answer
         the page logs `seazn:score-stale=true` once, and `seazn:score-stale=false` on the next good
         answer (case 7, score-down). Until fake-control has answered, no stale line is logged.

     What it says, on F-001's console channel (console.info, read from the `cefconsole` log
     category; never window.gstSendMsg, whose js-signal mode hangs start() and set_state(NULL)):
       - `seazn:ready`, 500 ms after load (`ready_after_ms=N` moves it);
       - `seazn:alive`, every 2 s after ready (the page contract's cef_alive_every_ms; Owed 18).

     Query switches:
       noready=1            never log seazn:ready (and so never beat)
       ready_after_ms=N     log seazn:ready N ms after load (default 500)
       static=1             paint once, at load, and never again: no animation, so every frame the
                            page paints comes before its ready (Owed 99: the adapter keeps it for
                            the ready)
       crash=1              after ready, block the page in `while (true) {}` (a hang, not a crash:
                            the renderer stays alive, and the beat stops with the rest of the page);
                            it console.warns `hang starts` first, so a test sees the moment
       crash_after_ms=N     how long after ready the hang starts (default 500)
       revive_after_ms=N    the hang ends after N ms, and the page beats and paints again
                            (default: never)
       stale=1              after ready, log `seazn:score-stale=true` once (R2005's line form)
       fresh_after_ms=N     with stale=1, log `seazn:score-stale=false` N ms after the true line
       channel=V            after ready, log `seazn:phase-channel=V` once (loopback, web, or any
                            other value, which the adapter must ignore)
       alive_twin=1         after ready, also log `seazn:alive-x` once (a near-miss the adapter
                            must not take for a beat)
       echo_url=1           after ready, console.warn the page's own URL once (`page url
                            <location.href>`), token and all: a page warning, which the adapter
                            logs (it drops the page's info and debug output), and must log scrubbed
       echo_token=1         after ready, console.warn the bare `st` value once (`page token <st>`):
                            no `?` before it, so only the adapter's scrubber, which learned the token
                            from the URL, can mask it (PR #32 review m1)
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  .abs { position: absolute; }
  #square { left: 0; top: 0; width: 100px; height: 100px; background: #0000ff; }
  #white50 { left: 100px; top: 300px; width: 200px; height: 100px; background: rgba(255, 255, 255, 0.5); }
  #strip { left: 200px; top: 0; width: 1500px; height: 60px; font: bold 48px/60px monospace; color: #ff0; }
  .cell { position: absolute; top: 0; width: 24px; height: 24px; background: #000; z-index: 10; }
</style>
</head>
<body>
  <div id="square" class="abs"></div>
  <div id="white50" class="abs"></div>
  <div id="strip" class="abs">f0</div>
<script>
  const q = new URLSearchParams(location.search);
  const num = (name, fallback) => {
    const v = q.get(name);
    return v === null ? fallback : Number(v);
  };
  const strip = document.getElementById("strip");
  let frames = 0;
  function tick() {
    frames++;
    strip.textContent = "f" + frames + " t" + Date.now();
    requestAnimationFrame(tick);
  }
  if (q.get("static") !== "1") requestAnimationFrame(tick);

  function busy(ms) {
    // `ms` absent: the hang never ends.
    const until = ms === null ? Infinity : Date.now() + ms;
    while (Date.now() < until) {}
  }

  function afterReady() {
    setInterval(() => console.info("seazn:alive"), 2000);
    if (q.get("stale") === "1") {
      console.info("seazn:score-stale=true");
      const fresh = num("fresh_after_ms", null);
      if (fresh !== null) setTimeout(() => console.info("seazn:score-stale=false"), fresh);
    }
    const channel = q.get("channel");
    if (channel !== null) console.info("seazn:phase-channel=" + channel);
    if (q.get("alive_twin") === "1") console.info("seazn:alive-x");
    if (q.get("echo_url") === "1") console.warn("page url " + location.href);
    if (q.get("echo_token") === "1") console.warn("page token " + q.get("st"));
    if (q.get("crash") === "1") {
      const revive = num("revive_after_ms", null);
      setTimeout(() => {
        console.warn("hang starts");
        busy(revive);
      }, num("crash_after_ms", 500));
    }
  }

  // The score strip (C13), at the fixture's path only.
  if (location.pathname.startsWith("/overlay/fixtures/")) {
    const delay = num("delay", 0);
    const cells = [];
    for (let k = 0; k < 16; k++) {
      const c = document.createElement("div");
      c.className = "cell";
      c.style.left = (1536 + 24 * k) + "px";
      document.body.appendChild(c);
      cells.push(c);
    }
    let events = [];
    let shown = -1;
    let pollMs = 1000;
    let staleAfter = null;
    let lastGood = Date.now();
    let stale = false;
    function paint() {
      const now = Date.now();
      let index = 0;
      for (const e of events) {
        if (e.at + delay <= now && e.index > index) index = e.index;
      }
      if (index !== shown) {
        const drawn = Math.min(index, 0xfffe) + 1;
        for (let k = 0; k < 16; k++) {
          cells[k].style.background = (drawn >> (15 - k)) & 1 ? "#fff" : "#000";
        }
        shown = index;
      }
    }
    async function poll() {
      let good = false;
      try {
        const r = await fetch("/score.json", { cache: "no-store" });
        if (r.ok) {
          const body = await r.json();
          if (Array.isArray(body.events)) {
            events = body.events;
            good = true;
          }
        }
      } catch (e) {
        // Keep the last good answer.
      }
      const now = Date.now();
      if (good) {
        lastGood = now;
        if (stale) {
          stale = false;
          console.info("seazn:score-stale=false");
        }
      } else if (!stale && staleAfter !== null && now - lastGood >= staleAfter) {
        stale = true;
        console.info("seazn:score-stale=true");
      }
    }
    async function pageControl() {
      try {
        const r = await fetch("/page-control.json", { cache: "no-store" });
        if (!r.ok) return;
        const c = await r.json();
        if (typeof c.stale_after_ms === "number") staleAfter = c.stale_after_ms;
        if (typeof c.poll_ms === "number" && c.poll_ms > 0) pollMs = c.poll_ms;
        if (c.hang === true) {
          console.warn("hang starts");
          busy(null);
        }
      } catch (e) {
        // fake-control is down: no hang, and the stale rule keeps its last numbers.
      }
    }
    async function loop() {
      await pageControl();
      await poll();
      setTimeout(loop, pollMs);
    }
    paint();
    loop();
    setInterval(paint, 50);
  }

  if (q.get("noready") !== "1") {
    setTimeout(() => {
      console.info("seazn:ready");
      afterReady();
    }, num("ready_after_ms", 500));
  }
</script>
</body>
</html>
